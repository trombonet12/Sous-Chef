name: Release Android

# Solo manual. Compila el APK release firmado y publica una GitHub Release (tag v<versionName>).
# Secrets requeridos (Settings > Secrets and variables > Actions):
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
# SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName de la release (opcional; por defecto el de app/build.gradle.kts)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build firmado y GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verificar secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name. Configuralo en Settings > Secrets and variables > Actions (un release sin firma o sin backend no sirve)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Determinar version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -z "$v" ]; then
            v="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z][0-9A-Za-z._-]*$'; then
            echo "::error::versionName invalido o no encontrado: '$v'"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Propiedades locales con Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          umask 077
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "supabase.url=$SUPABASE_URL"
            echo "supabase.publishableKey=$SUPABASE_PUBLISHABLE_KEY"
          } > local.properties

      - name: Decodificar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sous-chef-release.jks"
          echo "SOUSCHEF_KEYSTORE_FILE=$RUNNER_TEMP/sous-chef-release.jks" >> "$GITHUB_ENV"

      - name: assembleRelease
        env:
          SOUSCHEF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOUSCHEF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOUSCHEF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Preparar assets y checksums
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$apk" || { echo "::error::No se genero el APK release"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/sous-chef-${VERSION}.apk"
          (cd dist && sha256sum "sous-chef-${VERSION}.apk" > checksums.txt)

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "dist/sous-chef-${VERSION}.apk" dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "Sous Chef ${VERSION}" \
            --generate-notes

      - name: Borrar keystore y propiedades locales
        if: always()
        run: rm -f "$RUNNER_TEMP/sous-chef-release.jks" local.properties
