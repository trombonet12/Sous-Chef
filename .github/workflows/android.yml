name: Android

on:
  pull_request:
    paths:
      - 'app/**'
      - 'receta/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'data/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gate Android, dominio y recetas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Propiedades locales vacias (sin backend en CI)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: ktlint, detekt, lint, tests y assembleDebug
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest :receta:test :tools:test assembleDebug
      - name: Validar recetas y tecnicas
        continue-on-error: false
        run: scripts/sc validar --estricto
      - name: Subir APK debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Subir reportes de lint y tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
