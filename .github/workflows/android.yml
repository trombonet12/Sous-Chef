name: Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'receta/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
      - 'data/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'receta/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
      - 'data/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # En main no se cancela un run en curso: podria llevar una release a medias.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Gate Android, dominio y recetas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Propiedades locales (solo sdk.dir)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: ktlint, detekt, lint, tests y assembleDebug
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest :receta:test :tools:test assembleDebug
      - name: Validar recetas y tecnicas
        continue-on-error: false
        run: scripts/sc validar --estricto
      - name: Subir APK debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Subir reportes de lint y tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Release firmada (si la version es nueva)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      publicar: ${{ steps.ver.outputs.publicar }}
    concurrency:
      group: release-android
      cancel-in-progress: false
    # Secrets requeridos (Settings > Secrets and variables > Actions):
    # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
    # Opcional: PLAY_SERVICE_ACCOUNT_JSON, que usa el job `play` (abajo).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Leer version y comprobar si ya esta publicada
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*//p' version.properties | tr -d '\r' | head -n1)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::versionName invalido o no encontrado en version.properties: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "v${version} ya publicada, nada que hacer"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar secrets de firma
        if: steps.ver.outputs.publicar == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name. Configuralo en Settings > Secrets and variables > Actions (un release sin firma no sirve)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.ver.outputs.publicar == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.ver.outputs.publicar == 'true'

      - name: Propiedades locales (solo sdk.dir)
        if: steps.ver.outputs.publicar == 'true'
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decodificar keystore
        if: steps.ver.outputs.publicar == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sous-chef-release.jks"
          echo "SOUSCHEF_KEYSTORE_FILE=$RUNNER_TEMP/sous-chef-release.jks" >> "$GITHUB_ENV"

      - name: assembleRelease y bundleRelease
        if: steps.ver.outputs.publicar == 'true'
        env:
          SOUSCHEF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOUSCHEF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOUSCHEF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Preparar assets y checksums
        if: steps.ver.outputs.publicar == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          aab="$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)"
          test -n "$apk" || { echo "::error::No se genero el APK release"; exit 1; }
          test -n "$aab" || { echo "::error::No se genero el AAB release"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/sous-chef-${VERSION}.apk"
          cp "$aab" "dist/sous-chef-${VERSION}.aab"
          # Simbolos nativos para Play: carpetas de ABI en la raiz del zip (<abi>/<lib>.so), tal como salen de base/lib del AAB.
          symdir="$(mktemp -d)"
          if unzip -q "$aab" 'base/lib/*' -d "$symdir" 2>/dev/null && [ -d "$symdir/base/lib" ]; then
            (cd "$symdir/base/lib" && zip -qr "$GITHUB_WORKSPACE/dist/native-debug-symbols-${VERSION}.zip" .)
          else
            echo "::notice::El AAB no tiene base/lib (sin codigo nativo): no se genera native-debug-symbols."
          fi
          rm -rf "$symdir"
          (cd dist && files=("sous-chef-${VERSION}.apk" "sous-chef-${VERSION}.aab")             && { [ ! -f "native-debug-symbols-${VERSION}.zip" ] || files+=("native-debug-symbols-${VERSION}.zip"); }             && sha256sum "${files[@]}" > checksums.txt)

      - name: Crear GitHub Release
        if: steps.ver.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          assets=("dist/sous-chef-${VERSION}.apk" "dist/sous-chef-${VERSION}.aab" dist/checksums.txt)
          if [ -f "dist/native-debug-symbols-${VERSION}.zip" ]; then
            assets+=("dist/native-debug-symbols-${VERSION}.zip")
          fi
          gh release create "v${VERSION}" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Sous Chef ${VERSION}" \
            --generate-notes

      - name: Guardar AAB y notas para el job play
        if: steps.ver.outputs.publicar == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-${{ steps.ver.outputs.version }}
          path: |
            dist/sous-chef-${{ steps.ver.outputs.version }}.aab
            dist/native-debug-symbols-*.zip
            distribution/whatsnew/
          if-no-files-found: error
          retention-days: 7

      - name: Borrar keystore y propiedades locales
        if: always()
        run: rm -f "$RUNNER_TEMP/sous-chef-release.jks" local.properties

  # Subida a Google Play (ADR-0010, docs/play.md). Job aparte y sin permisos: la acción de terceros no ve el keystore
  # ni un GITHUB_TOKEN con escritura. Si falla, la release de GitHub ya está hecha y el AAB va adjunto para subirlo a
  # mano. Sin el secreto PLAY_SERVICE_ACCOUNT_JSON se omite con un aviso.
  play:
    name: Google Play (pista interna)
    needs: release
    if: needs.release.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Comprobar credenciales y estado
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_ESTADO: ${{ vars.PLAY_ESTADO || 'draft' }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Sin PLAY_SERVICE_ACCOUNT_JSON: no se sube a Google Play (ver docs/play.md)."
            echo "subir=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PLAY_ESTADO" in
            draft|completed) ;;
            *) echo "::error::PLAY_ESTADO debe ser draft o completed, no '$PLAY_ESTADO'"; exit 1 ;;
          esac
          echo "estado=$PLAY_ESTADO" >> "$GITHUB_OUTPUT"
          echo "subir=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.play.outputs.subir == 'true'
        with:
          name: play-${{ needs.release.outputs.version }}
          path: play

      - name: Localizar simbolos nativos
        id: sym
        if: steps.play.outputs.subir == 'true'
        env:
          ZIP: play/dist/native-debug-symbols-${{ needs.release.outputs.version }}.zip
        run: |
          if [ -f "$ZIP" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin native-debug-symbols en el artifact: se sube solo el AAB."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir el AAB
        if: steps.play.outputs.subir == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.trombito.souschef
          releaseFiles: play/dist/sous-chef-${{ needs.release.outputs.version }}.aab
          track: internal
          status: ${{ steps.play.outputs.estado }}
          # Prioridad 5: la app fuerza la actualización inmediata (ADR-0013). Con 3, la versión no es obligatoria.
          inAppUpdatePriority: 5
          # El mapping de R8 va dentro del AAB: https://developer.android.com/topic/performance/app-optimization/test-and-troubleshoot-the-optimization
          whatsNewDirectory: play/distribution/whatsnew
          # Los .so de AndroidX vienen stripped: se sube la tabla de simbolos exportados para que Play no avise.
          debugSymbols: ${{ steps.sym.outputs.existe == 'true' && format('play/dist/native-debug-symbols-{0}.zip', needs.release.outputs.version) || '' }}
