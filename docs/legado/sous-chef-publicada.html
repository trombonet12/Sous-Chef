      /* La nota dicta con las manos ocupadas; el porqué argumenta. Es el
         mismo texto de la ficha y está a un toque, sin salir de aquí. Las
         técnicas de la receta -sofrito, reducción...- son del plato entero,
         no de este paso en concreto, así que solo se enseñan aquí dentro,
         junto al porqué abierto, para no ocupar sitio permanente. */
      var tecnicas = Array.isArray(api.tecnicas) ? api.tecnicas : [];
      var htmlTecnicas = tecnicas.length
        ? '<div class="vc-tecnicas">' + tecnicas.map(function (tc) {
            return '<button type="button" class="vc-tec-link" data-vc="tecnica" data-tec="' +
              esc(tc.slug) + '">Técnica: ' + esc(tc.titulo) + ' →</button>';
          }).join('') + '</div>'
        : '';
      if (p.porq || tecnicas.length) {
        N.porque.innerHTML =
          '<button type="button" class="vc-porque-btn" data-vc="porque" aria-expanded="' +
            (M.porqueAbierto ? 'true' : 'false') + '">' +
            (M.porqueAbierto ? 'Menos ▴' : 'Ver el porqué ▾') + '</button>' +
          (M.porqueAbierto ? (p.porq ? '<p>' + esc(p.porq) + '</p>' : '') + htmlTecnicas : '');
      } else {
        N.porque.innerHTML = '';
      }

      var n2 = c.pasos[s.i + 1];
      N.sig.innerHTML = n2
        ? 'Después aquí: <b>' + esc(n2.t) + '</b> · ' + minTxt(n2.s) + ' min' +
          (n2.f != null ? ' al ' + n2.f : '')
        : 'Último paso de este recipiente.';

      if (bloqueado) {
        h.className = 'vc-principal vc-bloq';
        /* el rótulo se acorta hasta que quepa en su columna: lo que no
           puede perderse es el nombre del carril al que hay que ir */
        h.textContent = 'Antes: ' + corta(mapa[f[0]].paso.t, 16) + ' · ir a ' + mapa[f[0]].carril.nombre;
        h.dataset.ir = mapa[f[0]].carril.id;
        pl.textContent = 'Empezar igual';
      } else {
        delete h.dataset.ir;
        h.className = 'vc-principal' + (q <= 0 ? ' vc-urge' : '');
        h.textContent = n2 ? 'Hecho · siguiente' : 'Hecho · cerrar';
        pl.textContent = !s.corriendo ? 'Empezar' : (s.pausado ? 'Seguir' : 'Pausa');
      }
    }

    function pinta() {
      if (!M || M.cerrado) return;
      pintaTabs(); pintaPanel(); pintaAvisos(); pintaPlan();
    }

    /* ---------- 9. remate ---------- */
    function cierra() {
      M.cerrado = true;
      if (M.tic) { clearInterval(M.tic); M.tic = null; }
      ['cab', 'panel', 'mandos'].forEach(function (z) { Z[z].classList.add('vc-oculto'); });
      Z.final.classList.remove('vc-oculto');
      var reales = M.arrancado ? Math.round((Date.now() - M.arrancado) / 60000) : null;
      N.resumen.innerHTML = carriles.map(function (c) {
        var min = Math.round(c.pasos.reduce(function (a, p) { return a + p.s; }, 0) / 60);
        return '<li><b>' + esc(c.nombre) + '</b>' +
          c.pasos.length + (c.pasos.length === 1 ? ' paso' : ' pasos') + ' · ' +
          min + ' min' + (c.tipo === 'fuego' ? ' de fuego' : '') + '</li>';
      }).join('') +
        (reales ? '<li><b>HAS TARDADO</b>' + reales + ' min desde que abriste la cocina</li>' : '') +
        '<li><b>SERVIDO</b>' + hhmm(new Date()) + ', previsto ' + hhmm(servirDate()) + '</li>';
      tresPitos();
      vibra([200, 100, 200]);
      notifica(receta.titulo || 'Sous Chef', 'Todo listo. A la mesa.');
      if (M.lock) { try { M.lock.release(); } catch (e) { } M.lock = null; }
    }

    /* ---------- 10. barrido de avisos ----------
       No cuenta nada: mira el reloj y dispara lo que haya vencido desde
       la última vez. Por eso da igual que el móvil se salte tics —
       bloqueado, en otra app o con la pestaña dormida—: al volver, este
       mismo barrido pone al día todo de golpe. */
    function barre() {
      carriles.forEach(function (c) {
        var s = est[c.id];
        if (s.fin) return;
        var p = c.pasos[s.i];

        if (corre(c)) {
          var q = quedan(c), t = p.s - q;
          /* hitos del paso: los que ya han vencido y no se han dado */
          p.hitos.forEach(function (hito, k) {
            if (s.hechos[k] || t < hito.en) return;
            s.hechos[k] = true;
            /* uno vencido hace mucho (estabas fuera) no merece pitido
               propio: se apunta y ya suena el resumen de vuelta */
            if (t - hito.en < HITO_VIVO) {
              pitoHito(); vibra([90, 70, 90]);
              notifica(c.nombre, hito.t);
            }
          });
          if (!s.a10 && q <= 10 && q > 0) { s.a10 = true; unPito(); vibra(120); }
          if (!s.aFin && q <= 0) {
            s.aFin = true; s.a10 = true;
            tresPitos(); vibra([150, 100, 150, 100, 300]);
            notifica(c.nombre, p.t + ': hecho');
          }
          return;
        }

        /* pita una vez cuando a un recipiente parado le llega su hora */
        if (s.corriendo) return;
        if (faltan(p).length) { s.avisado = false; return; }
        if (sugerido(p.off) - new Date() <= 0 && !s.avisado) {
          s.avisado = true; unPito(); vibra([100, 80, 100]);
          notifica(c.nombre, 'Toca empezar: ' + p.t);
        }
      });
    }

    function latido() {
      if (!M || M.cerrado) return;
      barre();
      pinta();
    }

    /* Qué te has perdido. No se apunta cuando suena la alarma —un tic
       rezagado en segundo plano se la habría comido—: se lee del estado
       al volver, que es lo que de verdad hay en los fuegos. `fuera` son
       los segundos que has estado fuera, y acota qué cuenta como nuevo. */
    function resumenDeVuelta(fuera) {
      var out = [];
      function desde(seg) {
        var m = Math.round(seg / 60);
        return m >= 1 ? ' · hace ' + m + ' min' : '';
      }
      carriles.forEach(function (c) {
        var s = est[c.id];
        if (s.fin) return;
        var p = c.pasos[s.i];
        if (corre(c)) {
          var q = quedan(c), t = p.s - q;
          p.hitos.forEach(function (h) {
            if (t < h.en || t - h.en > fuera) return;
            out.push(c.nombre + ': ' + h.t + desde(t - h.en));
          });
          /* vencido es vencido: aunque sonara antes de irte, al volver
             lo primero que quieres saber es qué está esperándote */
          if (q <= 0) out.push(c.nombre + ' · ' + p.t + ': terminado' + desde(-q));
          return;
        }
        if (s.corriendo || faltan(p).length) return;
        var tarde = Math.round((new Date() - sugerido(p.off)) / 1000);
        if (tarde >= 0 && tarde <= fuera) out.push(c.nombre + ': toca empezar ' + p.t + desde(tarde));
      });
      return out;
    }

    /* ---------- 11. reiniciar toda la cocina ----------
       Vive en el mismo aviso de «reanudado»/«mientras no mirabas». Dos
       toques: el primero arma el botón (texto de aviso, 4 s para
       arrepentirse), el segundo borra el progreso guardado y vuelve a
       montar la vista desde cero, como si no se hubiera abierto la
       receta. */
    function desarma(boton) {
      if (M.reinicioTO) { clearTimeout(M.reinicioTO); M.reinicioTO = null; }
      if (boton) {
        boton.removeAttribute('data-armado');
        boton.textContent = 'REINICIAR';
      }
    }
    function reiniciar() {
      try { if (typeof api.reinicia === 'function') api.reinicia(); } catch (e) { }
      api.estado = {};
      render(host, receta, api);
    }

    function avisaVuelta(lista) {
      if (!lista.length) { return; }
      N['devuelta-txt'].innerHTML = '<b>MIENTRAS NO MIRABAS</b>' +
        lista.slice(0, 4).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
      N.devuelta.classList.remove('vc-oculto');
      tresPitos();
      vibra([200, 90, 200]);
    }

    /* ---------- 12. eventos ---------- */
    function abre(focoPreferido) {
      M.abierto = true;
      host.querySelector('#vc-servir').value = valorServir();
      Z.portada.classList.add('vc-oculto');
      ['cab', 'panel', 'mandos'].forEach(function (z) { Z[z].classList.remove('vc-oculto'); });
      /* el foco arranca en el primer carril accionable, nunca en uno bloqueado */
      M.foco = (focoPreferido && porId[focoPreferido] && !est[focoPreferido].fin)
        ? focoPreferido
        : (siguienteAccionable() || siguientePorHora() || carriles[0]).id;
      if (!M.arrancado) M.arrancado = Date.now();
      /* El paso «actual» de cada carril, en cuanto se abre la cocina de
         verdad, si no venía ya de una recarga: es el punto de partida
         para medir cuánto se tarda de verdad en cada uno. */
      carriles.forEach(function (c) {
        var s = est[c.id];
        if (!s.fin && !s.inicioPaso) s.inicioPaso = Date.now();
      });
      reiniciaAvisos();
      ctx(); despierta(); tabsHTML(); pinta();
      pideNotis();
      guarda();
      if (M.tic) clearInterval(M.tic);
      M.tic = setInterval(latido, 1000);
      if (todoHecho()) cierra();
    }

    M.onClick = function (e) {
      var t = e.target && e.target.closest ? e.target.closest('[data-vc]') : null;
      if (!t || !host.contains(t)) return;
      var q = t.getAttribute('data-vc');

      /* Guardia anti-rebote: 'hecho' salta un paso entero y no hay vuelta
         atrás; 'play' arranca/pausa un fuego de verdad, no un adorno;
         'cocinado' cierra la receta. El bote del dedo mojado o el ghost
         click son DOS eventos de click para un solo gesto, procesados
         uno detrás de otro en la misma vuelta del bucle de eventos —
         sin que el usuario haya soltado y vuelto a tocar. Eso NO es lo
         mismo que dos toques deliberados y rápidos (dos pasos cortos
         seguidos, con las manos en la sartén): esos sí llegan como
         eventos separados, con el navegador de por medio, aunque sean
         solo unas décimas de segundo. Por eso esto no es una ventana de
         tiempo — 400 ms de por sí bloqueaban pasos cortos legítimos,
         seguidos en el mismo carril, como demostró la batería— sino un
         cerrojo por mando+carril que se suelta en cuanto el bucle de
         eventos respira (setTimeout 0): un segundo click que ya estaba
         en cola detrás del primero lo encuentra cerrado y se descarta;
         uno que llega después, en su propia vuelta del bucle aunque sea
         poco después, ya lo encuentra abierto.
         Va por mando+carril (M.foco), no solo por mando: cambiar de
         pestaña y tocar «Hecho» en OTRO recipiente es una acción
         distinta y legítima aunque lleguen pegadas. 'cocinado' no tiene
         carril que valga, así que su cerrojo es global sin más.
         'reiniciar' NO lleva guardia: ya tiene la suya propia y mejor —
         arma con el primer toque («¿SEGURO?») y solo el segundo, real,
         confirma en un plazo de varios segundos; aquí un cerrojo solo
         estorbaría el flujo normal de confirmar. */
      if (q === 'hecho' || q === 'play' || q === 'cocinado') {
        var claveToque = (q === 'cocinado') ? q : (q + ':' + M.foco);
        if (M.bloqueoToque[claveToque]) return;
        M.bloqueoToque[claveToque] = true;
        setTimeout(function () {
          if (M) M.bloqueoToque[claveToque] = false;
        }, 0);
      }

      if (q === 'volver' || q === 'volver-final') {
        if (typeof api.volver === 'function') { try { api.volver(); } catch (er) { } }
        return;
      }
      if (q === 'mep') {
        var id = t.getAttribute('data-id');
        marcados[id] = !marcados[id];
        t.classList.toggle('vc-ok', !!marcados[id]);
        t.setAttribute('aria-pressed', marcados[id] ? 'true' : 'false');
        guarda();
        return;
      }
      if (q === 'abrir') { abre(null); return; }
      if (q === 'reiniciar') {
        if (t.getAttribute('data-armado') === '1') { reiniciar(); return; }
        t.setAttribute('data-armado', '1');
        t.textContent = '¿SEGURO?';
        desarma(null);
        M.reinicioTO = setTimeout(function () { desarma(t); }, 4000);
        return;
      }
      if (q === 'cerrar-devuelta') {
        desarma(host.querySelector('[data-vc="reiniciar"]'));
        N.devuelta.classList.add('vc-oculto');
        return;
      }
      if (q === 'porque') { M.porqueAbierto = !M.porqueAbierto; pintaPanel(); return; }
      if (q === 'tecnica') {
        if (typeof api.abrirTecnica === 'function') { try { api.abrirTecnica(t.getAttribute('data-tec')); } catch (er) { } }
        return;
      }
      if (q === 'foco') { ir(t.getAttribute('data-foco')); return; }
      if (q === 'plegar') { M.planAbierto = !M.planAbierto; pinta(); return; }
      if (q === 'play') {
        var c = carril(M.foco), s = est[M.foco];
        ctx(); despierta();
        if (!s.corriendo) {
          s.salto = true; s.corriendo = true; s.pausado = false;
          s.finAt = Date.now() + s.restante * 1000;
        } else if (s.pausado) {
          s.pausado = false;
          s.finAt = Date.now() + s.restante * 1000;
        } else {
          s.restante = quedan(c);
          s.pausado = true;
        }
        guarda();
        pinta();
        return;
      }
      if (q === 'mas') {
        var cm = carril(M.foco), sm = est[M.foco];
        if (corre(cm)) sm.finAt += 30000; else sm.restante += 30;
        var qm = quedan(cm);
        if (qm > 0) sm.aFin = false;
        if (qm > 10) sm.a10 = false;
        guarda();
        pinta();
        return;
      }
      if (q === 'hecho') {
        if (t.dataset.ir) { ir(t.dataset.ir); return; }
        var ch = carril(M.foco), sh = est[M.foco];
        /* El tiempo real del paso que se acaba de dar por hecho: desde
           que se volvió «actual» hasta ahora, mande o no el reloj. */
        var pasoHecho = ch.pasos[sh.i];
        if (sh.inicioPaso) {
          M.pasosReales[pasoHecho.id] = Math.max(1, Math.round((Date.now() - sh.inicioPaso) / 1000));
        }
        if (sh.i < ch.pasos.length - 1) {
          sh.i++;
          sh.restante = ch.pasos[sh.i].s; sh.finAt = null;
          sh.corriendo = false; sh.pausado = false;
          sh.a10 = false; sh.aFin = false; sh.salto = false; sh.hechos = {};
          sh.avisado = (sugerido(ch.pasos[sh.i].off) - new Date() <= 0);
          sh.inicioPaso = Date.now();
          M.porqueAbierto = false;
          guarda();
          pinta();
        } else {
          sh.fin = true; sh.corriendo = false; sh.pausado = false;
          guarda();
          if (todoHecho()) { cierra(); return; }
          /* este carril ya no ofrece nada que pulsar: el foco se va solo al
             siguiente accionable. Si no hay ninguno, se queda aquí y el pie
             enseña la salida (lo resuelve pintaPanel). */
          var sig = siguienteAccionable();
          if (sig && sig.id !== M.foco) ir(sig.id); else pinta();
        }
        return;
      }
      if (q === 'cocinado') {
        var campo = N['nota-final'];
        var nota = campo && campo.value ? String(campo.value).trim() : '';
        var reales = M.arrancado ? Math.round((Date.now() - M.arrancado) / 60000) : null;
        if (typeof api.cocinado === 'function') {
          try { api.cocinado(nota || undefined, reales, M.pasosReales); } catch (er) { }
        }
        return;
      }
    };
    host.addEventListener('click', M.onClick);

    M.onInput = function (e) {
      var t = e.target;
      if (!t || t.getAttribute('data-vc') !== 'servir') return;
      var v = t.value;
      if (!/^\d{1,2}:\d{2}$/.test(v)) return;
      horaServir = v;
      host.querySelector('#vc-servir0').value = v;
      host.querySelector('#vc-servir').value = v;
      reiniciaAvisos();
      if (M.abierto && !M.cerrado) pinta();
      guarda();
    };
    host.addEventListener('input', M.onInput);

    M.onTS = function (e) {
      if (!e.touches || e.touches.length !== 1) return;
      M.x0 = e.touches[0].clientX; M.y0 = e.touches[0].clientY;
    };
    M.onTE = function (e) {
      if (M.x0 === null || !M.abierto || M.cerrado) return;
      var c = e.changedTouches && e.changedTouches[0];
      if (c) {
        var dx = c.clientX - M.x0, dy = c.clientY - M.y0;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) rota(dx < 0 ? 1 : -1);
      }
      M.x0 = M.y0 = null;
    };
    Z.panel.addEventListener('touchstart', M.onTS, { passive: true });
    Z.panel.addEventListener('touchend', M.onTE, { passive: true });
    M.zonaPanel = Z.panel;

    M.onKey = function (e) {
      if (!M || !M.abierto || M.cerrado) return;
      var a = document.activeElement;
      if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      if (e.key === 'ArrowRight') { rota(1); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { rota(-1); e.preventDefault(); }
    };
    document.addEventListener('keydown', M.onKey);

    /* Volver a la app es el momento de la verdad: el intervalo puede
       haber estado congelado, pero los instantes de fin no. Se barre
       todo lo vencido, se cuenta qué pasó y se pide otra vez el wake
       lock, que el sistema suelta al minimizar. */
    M.onVis = function () {
      if (!M) return;
      if (document.visibilityState === 'hidden') { M.oculto = Date.now(); return; }
      if (!M.abierto || M.cerrado) return;
      M.lock = null;
      despierta();
      ctx();
      var fuera = M.oculto ? Date.now() - M.oculto : 0;
      M.oculto = 0;
      barre();
      pinta();
      if (fuera > 8000) {
        avisaVuelta(resumenDeVuelta(Math.round(fuera / 1000) + 5));
        guarda();
      }
    };
    document.addEventListener('visibilitychange', M.onVis);

    /* Si veníamos de una cocina abierta (recarga, pestaña descartada,
       vuelta al día siguiente no), se entra directo donde estabas en vez
       de a la portada de la mise en place. */
    if (estadoPrevio && estadoPrevio.abierto && !caducado && !todoHecho()) {
      M.reanudado = true;
      abre(estadoPrevio.foco);
      barre();
      pinta();
      var pendientes = resumenDeVuelta(Math.round((Date.now() - tsPrevio) / 1000) + 5);
      if (pendientes.length) avisaVuelta(pendientes);
      else {
        N['devuelta-txt'].innerHTML = '<b>REANUDADO</b><span>Seguimos donde lo dejaste.</span>';
        N.devuelta.classList.remove('vc-oculto');
      }
    }
  }

  window.VistaCrono = {
    render: render,
    destroy: limpia
  };
})();
</script>
<script>
/* ==========================================================================
   vista-tecnica.js — módulo de vista de una técnica (no una receta).
   Contrato: window.VistaTecnica = { render(host, tecnica), destroy() }.
   Pinta SOLO dentro de host. Sin almacenamiento, sin red, sin deps.

   Una técnica no es una receta cronometrada: no tiene raciones, ni
   carriles, ni cronómetro. Es la explicación de un gesto o una destreza
   (cómo hacer un corte, una masa, una fritura) que varias recetas pueden
   usar sin repetirla cada vez. Por eso reutiliza el papel de la ficha
   (mismas clases .v-ficha / .hoja / .portada / .corte de vista-ficha.css)
   en vez de traer una hoja de estilos propia: es el mismo objeto —una
   hoja de papel— con menos secciones.
   ========================================================================== */
(function () {
  'use strict';

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function crudo(v) { return v === null || v === undefined ? '' : String(v); }
  function lista(v) { return Object.prototype.toString.call(v) === '[object Array]' ? v : []; }
  function hay(v) { return lista(v).length > 0; }
  function txt(v) { return typeof v === 'string' && v.replace(/\s+/g, '') !== ''; }

  function htmlPortada(t) {
    var pasos = lista(t.pasos).length;
    var datos = [];
    if (txt(t.categoria)) datos.push(['<span style="text-transform:capitalize">' + esc(t.categoria) + '</span>', 'categoría']);
    if (pasos) datos.push([String(pasos), pasos === 1 ? 'paso' : 'pasos']);
    return '<header class="portada">' +
      '<h1>' + esc(t.titulo) + '</h1>' +
      (txt(t.resumen) ? '<p class="desc">' + esc(t.resumen) + '</p>' : '') +
      (datos.length ? '<div class="datos">' + datos.map(function (d) {
        return '<div class="dato"><b>' + crudo(d[0]) + '</b><span>' + esc(d[1]) + '</span></div>';
      }).join('') + '</div>' : '') +
    '</header>';
  }

  function htmlPasos(t) {
    var pasos = lista(t.pasos);
    if (!pasos.length) return '';
    var items = pasos.map(function (p) {
      return '<li>' +
        (txt(p.t) ? '<h3>' + esc(p.t) + '</h3>' : '') +
        (txt(p.p) ? '<p>' + esc(p.p) + '</p>' : '') +
      '</li>';
    }).join('');
    return '<section><h2>CÓMO SE HACE</h2><ol class="pasos">' + items + '</ol></section>';
  }

  function htmlCortes(t) {
    if (!hay(t.cortes)) return '';
    var cortes = lista(t.cortes).map(function (c) {
      return '<div class="corte">' + crudo(c.svg) +
        '<div>' + (txt(c.t) ? '<h3>' + esc(c.t) + '</h3>' : '') +
        (txt(c.p) ? '<p>' + esc(c.p) + '</p>' : '') + '</div></div>';
    }).join('');
    return '<section><h2>EL CORTE</h2><div>' + cortes + '</div></section>';
  }

  function htmlConsejos(t) {
    if (!hay(t.consejos)) return '';
    var items = lista(t.consejos).map(function (c) {
      return '<p>— ' + esc(c) + '</p>';
    }).join('');
    return '<section><h2>CONSEJOS</h2>' + items + '</section>';
  }

  window.VistaTecnica = {
    render: function (host, tecnica) {
      if (!host) return;
      var t = tecnica || {};
      host.innerHTML = '<div class="hoja">' +
        htmlPortada(t) +
        htmlPasos(t) +
        htmlCortes(t) +
        htmlConsejos(t) +
        (txt(t.pie) ? '<p class="pie">' + esc(t.pie) + '</p>' : '') +
      '</div>';
    },
    destroy: function () {}
  };
})();
</script>
<script>
/* ============================================================
   SHELL — router, base de datos, caché y las dos pantallas
   propias (recetas e historial). Las vistas de ficha y
   cronómetro son módulos aparte (window.VistaFicha / VistaCrono).

   Diseño de arranque: la app se pinta PRIMERO desde la caché del
   navegador y luego se pone al día cuando la base de datos
   responde. En la cocina eso es la diferencia entre abrir y
   esperar.
   ============================================================ */
(function () {
  'use strict';

  /* v3: la caché v2 guardaba también la cola, que ya no existe. Subir
     la versión es más barato que migrar y deja el teléfono limpio. */
  var K_CACHE = 'sous-chef-cache-v3';
  var K_PEND = 'sous-chef-pendientes-v1';
  /* La hora de servir por defecto es SIEMPRE 15:30: no se recuerda
     entre recetas ni entre sesiones, así que no vive en localStorage.
     Lo único que viaja es la hora que acabas de elegir en la ficha, de
     ahí a "Cronómetro →", y solo esa vez: HORA_TRANSITO se consume en
     cuanto se abre la cocina y vuelve a quedar en null. */
  var HORA_DEFECTO = '15:30';
  var horaTransito = null;

  var S = {
    db: null,
    estadoDb: 'conectando',   // conectando | listo | sin-db
    recetas: {},
    tecnicas: {},
    hist: {},
    /* Marcas del usuario receta a receta: la estrella y las raciones que
       elegiste la última vez. Van en la base de datos y no en este
       navegador porque son decisiones tuyas, no de este teléfono: la
       estrella que pones en el sofá tiene que estar en la cocina. */
    prefs: {},
    vista: 'recetas',
    slug: null,
    filtro: '',
    categoria: '',
    filtroTec: '',
    categoriaTec: '',
    filtroHist: '',
    aviso: null,
    subs: [],
    /* Qué colecciones ya han traído su primera foto. El cronómetro la usa
       para no abrir con las técnicas a medio cargar tras una recarga: sin
       esto, una recarga justo en mitad de un paso podría abrir la cocina
       antes de que llegue `tecnicas` y perder los enlaces para siempre en
       esa sesión, porque una vez abierta la cocina ya no se vuelve a mirar. */
    listas: {}
  };

  /* ---------------- utilidades ---------------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function vals(o) { return Object.keys(o).map(function (k) { return o[k]; }); }
  function hoy() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function fechaCorta(iso) {
    if (!iso) return '';
    var p = String(iso).slice(0, 10).split('-');
    if (p.length < 3) return iso;
    return Number(p[2]) + ' ' + (MESES[Number(p[1]) - 1] || '');
  }
  function guardaLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function leeLocal(k, pordefecto) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : pordefecto; } catch (e) { return pordefecto; }
  }

  /* Cuánto ha avanzado un estado de cocina guardado: la suma de en qué
     paso va cada carril. Sirve para comparar dos guardados del mismo
     `sous-chef-estado-<slug>` y decidir cuál va más lejos — no basta con
     "quién escribe el último", que es justo lo que hacía que una
     pestaña atrasada pisara el progreso de otra más avanzada. */
  function progresoEstado(doc) {
    var car = (doc && doc.carriles) || {};
    var total = 0;
    Object.keys(car).forEach(function (k) {
      var i = car[k] && car[k].i;
      if (isFinite(i)) total += i;
    });
    return total;
  }
  /* Puerta de escritura del estado del cronómetro en este navegador: la
     clave la comparten todas las pestañas del mismo origen, así que
     antes de escribir se mira qué hay ya guardado y no se pisa si va MÁS
     avanzado que lo que se quiere guardar ahora (empate de pasos: gana
     el `ts` más nuevo). Un reinicio a propósito no se bloquea con esto:
     `reinicia()` (en pintaCrono) borra la clave ANTES de que este
     guardado llegue, así que no hay nada guardado con lo que comparar y
     el reinicio siempre se escribe. */
  function guardaEstadoLocal(slug, doc) {
    var previo = leeLocal('sous-chef-estado-' + slug, null);
    if (previo) {
      var pAntes = progresoEstado(previo), pAhora = progresoEstado(doc);
      if (pAhora < pAntes) return;
      if (pAhora === pAntes && String(doc.ts || '') < String(previo.ts || '')) return;
    }
    guardaLocal('sous-chef-estado-' + slug, doc);
  }

  /* ---------------- caché y escrituras pendientes ---------------- */
  function guardaCache() {
    guardaLocal(K_CACHE, { recetas: S.recetas, tecnicas: S.tecnicas, hist: S.hist, prefs: S.prefs, ts: Date.now() });
  }
  function cargaCache() {
    var c = leeLocal(K_CACHE, null);
    if (!c) return false;
    S.recetas = c.recetas || {};
    S.tecnicas = c.tecnicas || {};
    S.hist = c.hist || {};
    S.prefs = c.prefs || {};
    return true;
  }
  var pendId = 0;
  function encola(op) {
    var p = leeLocal(K_PEND, []);
    /* Cada pendiente lleva su propio id (no el índice del array): así
       vuelcaPendientes() puede quitar de la cola justo la que ha
       confirmado, aunque la cola haya cambiado por debajo mientras
       tanto (otra escritura fallida metida en medio del volcado). */
    op.id = 'p' + Date.now() + '-' + (pendId++);
    p.push(op);
    guardaLocal(K_PEND, p);
  }
  /* Si algún día K_PEND sube de versión (v1 -> v2...) esto rescata la
     cola de la versión anterior antes de tirarla: es lo que no se hizo
     cuando la caché pasó de v2 a v3 y la cola vieja se abandonó. Corre
     una vez al arrancar, encuentre o no algo que rescatar. */
  function rescataPendientesViejas() {
    var prefijo = 'sous-chef-pendientes-v';
    var claves = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k !== K_PEND && k.indexOf(prefijo) === 0) claves.push(k);
      }
    } catch (e) { return; }
    claves.forEach(function (k) {
      var vieja = leeLocal(k, []);
      if (Array.isArray(vieja) && vieja.length) {
        var actual = leeLocal(K_PEND, []);
        guardaLocal(K_PEND, actual.concat(vieja));
      }
      try { localStorage.removeItem(k); } catch (e) {}
    });
  }
  function vuelcaPendientes() {
    var p = leeLocal(K_PEND, []);
    if (!p.length || !S.db) return;
    /* Las que vengan de una cola rescatada (o de antes de este cambio)
       pueden no traer id: se lo ponemos aquí para que quitaDePendientes
       pueda identificarlas una a una. */
    var faltaId = false;
    p.forEach(function (op) { if (!op.id) { op.id = 'p' + Date.now() + '-' + (pendId++); faltaId = true; } });
    if (faltaId) guardaLocal(K_PEND, p);
    /* La cola NO se vacía de golpe antes de saber qué ha ido bien: cada
       pendiente sale sola cuando SU reintento confirma que se ha
       escrito. Si la conexión cae a mitad del volcado, lo que no se
       haya confirmado se queda en la cola en vez de darse por enviado
       sin estarlo. */
    p.forEach(function (op) {
      escribe(op.ruta, op.datos, op.borrar, true).then(function (ok) {
        if (ok) quitaDePendientes(op.id);
      });
    });
  }
  function quitaDePendientes(id) {
    var p = leeLocal(K_PEND, []);
    var quedan = p.filter(function (op) { return op.id !== id; });
    if (quedan.length !== p.length) {
      guardaLocal(K_PEND, quedan);
      if (!capaCronoAbierta()) pinta();
    }
  }

  /* Una sola puerta para escribir: si no hay base de datos o falla,
     el cambio se queda en la cola de pendientes y se reintenta. */
  function escribe(ruta, datos, borrar, esReintento) {
    if (!S.db) {
      if (!esReintento) encola({ ruta: ruta, datos: datos, borrar: !!borrar });
      return Promise.resolve(false);
    }
    var ref;
    try { ref = S.db.doc(ruta); } catch (e) { return Promise.resolve(false); }
    var pr = borrar ? ref.delete() : ref.set(datos);
    return pr.then(function () { return true; }).catch(function () {
      /* Antes solo se encolaba si el error venía marcado como
         "unavailable" o "revoked": cualquier otro código (o ninguno) se
         tragaba el fallo en silencio y el cambio desaparecía sin más.
         Un fallo es un fallo: si no se ha podido escribir, se encola,
         sea cual sea la causa. */
      if (!esReintento) encola({ ruta: ruta, datos: datos, borrar: !!borrar });
      return false;
    });
  }

  /* ---------------- conexión ---------------- */
  function conecta() {
    var use = (window.claude && typeof window.claude.use === 'function')
      ? window.claude.use('db')
      : Promise.resolve(window.__MOCK_DB__ || null);

    return use.then(function (db) {
      S.db = db || window.__MOCK_DB__ || null;
      if (!S.db) {
        S.estadoDb = 'sin-db';
        /* Sin base de datos no va a llegar ninguna foto más: lo que haya en
           caché es todo lo que hay, así que se da por «listo» ya mismo. */
        S.listas.recetas = S.listas.tecnicas = S.listas.hist = S.listas.prefs = true;
        pinta();
        return;
      }
      S.estadoDb = 'listo';
      vuelcaPendientes();
      suscribe('recetas', 'recetas');
      suscribe('tecnicas', 'tecnicas');
      suscribe('historial', 'hist');
      suscribe('preferencias', 'prefs');
    }).catch(function () {
      S.estadoDb = 'sin-db';
      S.listas.recetas = S.listas.tecnicas = S.listas.hist = S.listas.prefs = true;
      pinta();
    });
  }

  function suscribe(coleccion, clave) {
    try {
      var un = S.db.collection(coleccion).onSnapshot(function (snap) {
        var m = {};
        snap.docs.forEach(function (d) {
          var o = d.data(); if (!o) return;
          o = JSON.parse(JSON.stringify(o));
          o._id = d.id;
          m[d.id] = o;
        });
        S[clave] = m;
        S.listas[clave] = true;
        guardaCache();
        if (!capaCronoAbierta()) pinta();
        else contadores();
      }, function () {
        /* suscripción muerta: seguimos con la caché, pero contada como
           «lista» para no bloquear el cronómetro esperando algo que no
           va a llegar. */
        S.listas[clave] = true;
      });
      S.subs.push(un);
    } catch (e) { S.listas[clave] = true; }
  }

  /* ---------------- router ---------------- */
  function leeRuta() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    var p = h.split('/').filter(Boolean);
    if (!p.length) return { vista: 'recetas' };
    if (p[0] === 'r' && p[1]) return { vista: 'receta', slug: decodeURIComponent(p[1]) };
    if (p[0] === 'c' && p[1]) return { vista: 'crono', slug: decodeURIComponent(p[1]) };
    if (p[0] === 't' && p[1]) return { vista: 'tecnica', slug: decodeURIComponent(p[1]) };
    if (p[0] === 'tecnicas') return { vista: 'tecnicas' };
    if (p[0] === 'historial') return { vista: 'historial' };
    return { vista: 'recetas' };
  }
  function ve(ruta) { location.hash = '#/' + ruta; }
  function alCambiarRuta() {
    var r = leeRuta();
    var eraCrono = S.vista === 'crono';
    S.vista = r.vista;
    S.slug = r.slug || null;
    if (eraCrono && r.vista !== 'crono') cierraCrono();
    pinta();
  }

  /* ---------------- derivados de la receta ---------------- */
  function carrilesDe(receta) {
    var m = {};
    (receta.carriles || []).forEach(function (c) { m[c.id] = c; });
    return m;
  }
  function huella(receta) {
    /* Mini-gantt: una línea por carril. Dice de un vistazo si el
       plato es de un fuego o de tres solapados, que es la primera
       cosa que quieres saber al elegir qué cocinar. */
    var total = receta.totalMin || 1;
    var cs = receta.carriles || [];
    var pasos = receta.pasos || [];
    if (!cs.length || !pasos.length) return '';
    var filas = cs.map(function (c) {
      var barras = pasos.filter(function (p) { return p.carril === c.id; }).map(function (p) {
        var izq = Math.max(0, (p.off || 0) / total * 100);
        var an = Math.max(1.2, (p.min || 1) / total * 100);
        return '<span class="sc-h-barra" style="left:' + izq.toFixed(2) + '%;width:' + Math.min(100 - izq, an).toFixed(2) + '%;background:' + esc(c.color || '#888') + '"></span>';
      }).join('');
      return '<div class="sc-h-fila">' + barras + '</div>';
    }).join('');
    /* Cada nombre lleva su punto de color: sin él la leyenda no dice
       qué línea de la huella es cada recipiente. */
    var leyenda = cs.map(function (c) {
      return '<span><i style="background:' + esc(c.color || '#888') + '"></i>' + esc(c.nombre) + '</span>';
    }).join('');
    return '<div class="sc-huella">' + filas + '</div><div class="sc-huella-pie">' + leyenda + '</div>';
  }
  function fuegosDe(receta) {
    var cs = carrilesDe(receta);
    var n = 0;
    Object.keys(cs).forEach(function (k) { if (cs[k].tipo === 'fuego') n++; });
    return n;
  }
  function ultimaVez(slug) {
    var f = null;
    vals(S.hist).forEach(function (h) {
      if (h.slug === slug && (!f || h.fecha > f)) f = h.fecha;
    });
    return f;
  }

  /* ---------------- marcas del usuario (preferencias/<slug>) ----------------
     Colección aparte y no `estado/<slug>`: el estado del cronómetro se
     reescribe entero en cada guardado, se borra al reiniciar y se limpia
     sola al anotar el plato en el historial. Una estrella metida ahí
     duraría hasta la primera vez que cocinaras la receta, que es justo
     cuando más ganas tienes de tenerla marcada. */
  function esFavorita(slug) {
    var p = S.prefs[slug];
    return !!(p && p.favorito);
  }
  /* Se escribe el documento entero partiendo del que ya había, así que
     una marca no pisa la otra: cambiar las raciones no apaga la estrella. */
  function guardaPref(slug, cambios) {
    var p = S.prefs[slug] || {};
    var doc = { slug: slug, favorito: !!p.favorito, raciones: p.raciones || null };
    Object.keys(cambios).forEach(function (k) { doc[k] = cambios[k]; });
    doc.ts = new Date().toISOString();
    S.prefs[slug] = doc;
    guardaCache();
    escribe('preferencias/' + slug, doc, false);
  }

  function aMedianoche(iso) {
    var p = String(iso || '').slice(0, 10).split('-');
    if (p.length < 3) return null;
    var t = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return isFinite(t) ? t : null;
  }
  /* Días enteros desde esa fecha. Se comparan medianoches en UTC para que
     un cambio de hora no invente ni se coma un día. */
  function diasDesde(fecha) {
    var a = aMedianoche(fecha), b = aMedianoche(hoy());
    if (a === null || b === null) return null;
    return Math.round((b - a) / 86400000);
  }
  /* «hace 3 semanas» se lee de un vistazo; «últ. 24 ago» hay que
     restarlo mentalmente contra el día que sea hoy. */
  function haceCuanto(dias) {
    if (dias <= 0) return 'hoy';
    if (dias === 1) return 'ayer';
    if (dias < 7) return 'hace ' + dias + ' días';
    if (dias < 30) {
      var sem = Math.floor(dias / 7);
      return 'hace ' + sem + (sem === 1 ? ' semana' : ' semanas');
    }
    if (dias < 365) {
      var mes = Math.floor(dias / 30);
      return 'hace ' + mes + (mes === 1 ? ' mes' : ' meses');
    }
    var an = Math.floor(dias / 365);
    return 'hace ' + an + (an === 1 ? ' año' : ' años');
  }
  /* El umbral de destacado son 60 días. Cocinando un par de veces por
     semana, el recetario entero rota en menos de un mes: dos meses no es
     «hace tiempo», es que la receta se ha caído de la rotación sin que te
     dieras cuenta. Por debajo de ahí el dato se lee sin gritar, con el
     mismo gris que tenía la fecha. La que no se ha hecho nunca se destaca
     siempre: es la que más fácil se queda para otro día. */
  var DIAS_FRIA = 60;
  function chipUltimaVez(fecha) {
    if (!fecha) return '<span class="sc-chip sc-urge">sin estrenar</span>';
    var d = diasDesde(fecha);
    if (d === null) return '';
    /* La fecha exacta no desaparece, se repliega al title: en la tarjeta
       manda el tiempo transcurrido, que es lo que se decide de un vistazo. */
    return '<span class="sc-chip ' + (d >= DIAS_FRIA ? 'sc-urge' : 'sc-min') +
      '" title="últ. ' + esc(fechaCorta(fecha)) + '">' + esc(haceCuanto(d)) + '</span>';
  }
  /* Las técnicas que cita una receta (tags.tecnica) solo cuentan si esa
     técnica existe de verdad como ficha propia: el tag es libre desde
     siempre, y no todos han tenido su ficha hasta ahora. */
  function tecnicasDe(receta) {
    var tags = (receta.tags && receta.tags.tecnica) || [];
    return tags.map(function (slug) { return S.tecnicas[slug]; })
      .filter(Boolean)
      .map(function (t) { return { slug: t.slug, titulo: t.titulo }; });
  }
  /* El enlace al revés: qué recetas citan esta técnica. Mismo criterio
     que tecnicasDe (coincidencia por slug en tags.tecnica), pero
     recorriendo todas las recetas en vez de una sola. */
  function recetasConTecnica(slug) {
    return vals(S.recetas)
      .filter(function (r) { return r.tags && (r.tags.tecnica || []).indexOf(slug) !== -1; })
      .map(function (r) { return { slug: r.slug, titulo: r.titulo }; })
      .sort(function (a, b) { return String(a.titulo || '').localeCompare(String(b.titulo || '')); });
  }

  /* ---------------- pintado ---------------- */
  function contadores() {
    $('n-recetas').textContent = Object.keys(S.recetas).length || '0';
    $('n-tecnicas').textContent = Object.keys(S.tecnicas).length || '0';
    $('n-hist').textContent = Object.keys(S.hist).length || '0';
    var b = $('barra').querySelectorAll('button');
    var actual = S.vista === 'receta' || S.vista === 'crono' ? 'recetas'
      : S.vista === 'tecnica' ? 'tecnicas' : S.vista;
    for (var i = 0; i < b.length; i++) {
      if (b[i].getAttribute('data-ir') === actual) b[i].setAttribute('aria-current', 'page');
      else b[i].removeAttribute('aria-current');
    }
  }

  function bandaAviso() {
    var partes = [];
    if (S.estadoDb === 'sin-db') {
      partes.push('<div class="sc-aviso sc-malo"><span>Sin conexión con la base de datos. Ves la última copia guardada en este teléfono y lo que marques se enviará cuando vuelva.</span></div>');
    } else if (S.estadoDb === 'conectando' && !Object.keys(S.recetas).length) {
      partes.push('<div class="sc-aviso"><span>Conectando…</span></div>');
    }
    var pend = leeLocal(K_PEND, []).length;
    if (pend) partes.push('<div class="sc-aviso"><span>' + pend + (pend === 1 ? ' cambio pendiente' : ' cambios pendientes') + ' de enviar.</span></div>');
    if (S.aviso) {
      if (Date.now() - S.aviso.ts > (S.aviso.ms || 20000)) S.aviso = null;
      else {
        partes.push('<div class="sc-aviso' + (S.aviso.deshacer ? ' sc-aviso-deshacer' : '') + '"><span>' + esc(S.aviso.txt) + '</span>' +
          (S.aviso.deshacer ? '<button type="button" class="sc-btn sc-sec" data-deshacer="1">Deshacer</button>' : '') +
          '</div>');
      }
    }
    return partes.join('');
  }

  function pinta() {
    contadores();
    var m = $('vista');
    if (S.vista === 'crono') { pintaCrono(); return; }
    document.body.classList.remove('crono-abierto');
    $('capa-crono').hidden = true;

    if (S.vista === 'receta') { pintaReceta(m); return; }
    if (S.vista === 'tecnica') { pintaTecnica(m); return; }
    /* Las tres pantallas propias llevan la cabecera de la app; la ficha
       no, porque la hoja ya trae su título y quedaban dos seguidos. */
    $('cabecera').hidden = false;
    $('titulo').textContent = 'Sous Chef';
    if (S.vista === 'historial') pintaHistorial(m);
    else if (S.vista === 'tecnicas') pintaTecnicas(m);
    else pintaRecetas(m);
  }

  /* --- pantalla 1: recetas --- */
  function pintaRecetas(m) {
    var todas = vals(S.recetas);
    var f = S.filtro.trim().toLowerCase();
    var porTexto = !f ? todas : todas.filter(function (r) {
      var saco = [r.titulo, r.descripcion, (r.tags && r.tags.base) || ''];
      (r.grupos || []).forEach(function (g) { (g.items || []).forEach(function (it) { saco.push(it.n); }); });
      (r.pasos || []).forEach(function (p) { saco.push(p.t); });
      return saco.join(' ').toLowerCase().indexOf(f) !== -1;
    });

    /* Categorías: cuántas recetas de cada base hay entre las que ya
       cumplen la búsqueda de texto, para que los números de los chips
       bajen a la vez que escribes en vez de quedarse fijos. */
    var basesCont = {};
    porTexto.forEach(function (r) {
      var b = r.tags && r.tags.base;
      if (b) basesCont[b] = (basesCont[b] || 0) + 1;
    });
    var bases = Object.keys(basesCont).sort();

    var lista = !S.categoria ? porTexto : porTexto.filter(function (r) { return r.tags && r.tags.base === S.categoria; });
    /* Las favoritas arriba, pase lo que pase con la fecha: ese es justo
       el problema que resuelven, que una receta buena de hace meses se
       hundía bajo cualquier retoque reciente. Dentro de cada mitad se
       sigue ordenando por la más reciente. */
    lista.sort(function (a, b) {
      var fa = esFavorita(a.slug) ? 1 : 0, fb = esFavorita(b.slug) ? 1 : 0;
      if (fa !== fb) return fb - fa;
      return String(b.actualizada || '').localeCompare(String(a.actualizada || ''));
    });

    $('subtitulo').textContent = lista.length ? lista.length + (lista.length === 1 ? ' receta' : ' recetas') : '';

    var html = bandaAviso();
    html += '<div class="sc-buscador"><input type="search" id="q" placeholder="Buscar por plato o ingrediente" value="' + esc(S.filtro) + '" autocomplete="off"></div>';

    /* Los chips de categoría solo aparecen si hay más de una base
       distinta: con una sola no filtran nada, solo estorban. */
    if (bases.length > 1) {
      html += '<div class="sc-catbar" role="group" aria-label="Filtrar por categoría">' +
        '<button type="button" class="sc-cat" data-cat="" aria-current="' + (!S.categoria) + '">Todas' +
          '<span class="sc-cat-n">' + porTexto.length + '</span></button>' +
        bases.map(function (b) {
          return '<button type="button" class="sc-cat" data-cat="' + esc(b) + '" aria-current="' + (S.categoria === b) + '">' + esc(b) +
            '<span class="sc-cat-n">' + basesCont[b] + '</span></button>';
        }).join('') +
      '</div>';
    }

    if (!lista.length) {
      html += Object.keys(S.recetas).length
        ? '<div class="sc-vacio"><b>Nada con eso</b>Prueba con un ingrediente' + (S.categoria ? ' o quita el filtro de categoría' : '') + '.</div>'
        : '<div class="sc-vacio"><b>Todavía no hay recetas</b>Pídeme una en el chat y aparecerá aquí sola.</div>';
    } else {
      html += '<div class="sc-recetas">' + lista.map(function (r) {
        var uv = ultimaVez(r.slug);
        var chips = [];
        chips.push('<span class="sc-chip sc-tiempo">' + (r.totalMin || '?') + ' min</span>');
        var nf = fuegosDe(r);
        if (nf) chips.push('<span class="sc-chip">' + nf + (nf === 1 ? ' fuego' : ' fuegos') + '</span>');
        if (r.tags && r.tags.base) chips.push('<span class="sc-chip">' + esc(r.tags.base) + '</span>');
        chips.push((r.compra && r.compra.length)
          ? '<span class="sc-chip sc-compra">compra</span>'
          : '<span class="sc-chip sc-despensa">despensa</span>');
        chips.push(chipUltimaVez(uv));
        /* La estrella va FUERA de la tarjeta, no dentro: un botón dentro
           de otro botón no es HTML válido y el navegador lo desmonta. Es
           hermana suya, colocada encima por CSS, y así marcar favorita no
           abre la receta. */
        var fav = esFavorita(r.slug);
        var rotulo = fav ? 'Quitar de favoritas' : 'Marcar como favorita';
        return '<div class="sc-tarjeta">' +
          '<button type="button" class="sc-receta" data-slug="' + esc(r.slug) + '">' +
          '<h3>' + esc(r.titulo) + '</h3>' +
          (r.descripcion ? '<p class="sc-desc">' + esc(r.descripcion) + '</p>' : '') +
          huella(r) +
          '<div class="sc-chips">' + chips.join('') + '</div>' +
          '</button>' +
          '<button type="button" class="sc-fav" data-fav="' + esc(r.slug) + '"' +
            ' aria-pressed="' + (fav ? 'true' : 'false') + '" aria-label="' + rotulo + '" title="' + rotulo + '">' +
            (fav ? '★' : '☆') + '</button>' +
          '</div>';
      }).join('') + '</div>';
    }
    m.innerHTML = html;

    var q = $('q');
    if (q) {
      q.addEventListener('input', function () {
        S.filtro = q.value;
        var pos = q.selectionStart;
        pintaRecetas(m);
        var q2 = $('q');
        if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    m.querySelectorAll('.sc-cat').forEach(function (b) {
      b.addEventListener('click', function () {
        var cat = b.getAttribute('data-cat');
        S.categoria = (cat === S.categoria) ? '' : cat;
        pintaRecetas(m);
      });
    });
    m.querySelectorAll('.sc-receta').forEach(function (b) {
      b.addEventListener('click', function () { ve('r/' + encodeURIComponent(b.getAttribute('data-slug'))); });
    });
    /* Repintar entera tras marcar es lo que se quiere ver: la receta sube
       al principio delante de tus ojos, que es la prueba de que la marca
       ha hecho algo. */
    m.querySelectorAll('.sc-fav').forEach(function (b) {
      b.addEventListener('click', function () {
        var slug = b.getAttribute('data-fav');
        guardaPref(slug, { favorito: !esFavorita(slug) });
        pintaRecetas(m);
      });
    });
  }

  /* --- pantalla 3: técnicas ---
     Lista aparte de las recetas: aquí no hay cronómetro ni raciones,
     solo gestos y destrezas (cómo hacer un corte, una masa, una
     fritura) que varias recetas pueden dar por sabidas. Mismo patrón
     de buscador + chips de categoría que en recetas, para que no haga
     falta aprender una pantalla nueva. */
  function pintaTecnicas(m) {
    var todas = vals(S.tecnicas);
    var f = S.filtroTec.trim().toLowerCase();
    var porTexto = !f ? todas : todas.filter(function (t) {
      var saco = [t.titulo, t.resumen, t.categoria || ''];
      (t.pasos || []).forEach(function (p) { saco.push(p.t); saco.push(p.p); });
      (t.consejos || []).forEach(function (c) { saco.push(c); });
      return saco.join(' ').toLowerCase().indexOf(f) !== -1;
    });

    var catsCont = {};
    porTexto.forEach(function (t) {
      if (t.categoria) catsCont[t.categoria] = (catsCont[t.categoria] || 0) + 1;
    });
    var cats = Object.keys(catsCont).sort();

    var lista = !S.categoriaTec ? porTexto : porTexto.filter(function (t) { return t.categoria === S.categoriaTec; });
    lista.sort(function (a, b) { return String(a.titulo || '').localeCompare(String(b.titulo || '')); });

    $('subtitulo').textContent = lista.length ? lista.length + (lista.length === 1 ? ' técnica' : ' técnicas') : '';

    var html = bandaAviso();
    html += '<div class="sc-buscador"><input type="search" id="qt" placeholder="Buscar por técnica" value="' + esc(S.filtroTec) + '" autocomplete="off"></div>';

    if (cats.length > 1) {
      html += '<div class="sc-catbar" role="group" aria-label="Filtrar por categoría">' +
        '<button type="button" class="sc-cat" data-cat="" aria-current="' + (!S.categoriaTec) + '">Todas' +
          '<span class="sc-cat-n">' + porTexto.length + '</span></button>' +
        cats.map(function (c) {
          return '<button type="button" class="sc-cat" data-cat="' + esc(c) + '" aria-current="' + (S.categoriaTec === c) + '">' + esc(c) +
            '<span class="sc-cat-n">' + catsCont[c] + '</span></button>';
        }).join('') +
      '</div>';
    }

    if (!lista.length) {
      html += Object.keys(S.tecnicas).length
        ? '<div class="sc-vacio"><b>Nada con eso</b>Prueba otra palabra' + (S.categoriaTec ? ' o quita el filtro de categoría' : '') + '.</div>'
        : '<div class="sc-vacio"><b>Todavía no hay técnicas</b>Pídeme una en el chat y aparecerá aquí sola.</div>';
    } else {
      html += '<div class="sc-recetas">' + lista.map(function (t) {
        var chips = [];
        if (t.categoria) chips.push('<span class="sc-chip">' + esc(t.categoria) + '</span>');
        var np = (t.pasos || []).length;
        if (np) chips.push('<span class="sc-chip sc-min">' + np + (np === 1 ? ' paso' : ' pasos') + '</span>');
        return '<button type="button" class="sc-receta" data-slug="' + esc(t.slug) + '">' +
          '<h3>' + esc(t.titulo) + '</h3>' +
          (t.resumen ? '<p class="sc-desc">' + esc(t.resumen) + '</p>' : '') +
          '<div class="sc-chips">' + chips.join('') + '</div>' +
          '</button>';
      }).join('') + '</div>';
    }
    m.innerHTML = html;

    var q = $('qt');
    if (q) {
      q.addEventListener('input', function () {
        S.filtroTec = q.value;
        var pos = q.selectionStart;
        pintaTecnicas(m);
        var q2 = $('qt');
        if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    m.querySelectorAll('.sc-cat').forEach(function (b) {
      b.addEventListener('click', function () {
        var cat = b.getAttribute('data-cat');
        S.categoriaTec = (cat === S.categoriaTec) ? '' : cat;
        pintaTecnicas(m);
      });
    });
    m.querySelectorAll('.sc-receta').forEach(function (b) {
      b.addEventListener('click', function () { ve('t/' + encodeURIComponent(b.getAttribute('data-slug'))); });
    });
  }

  /* --- pantalla 2: historial ---
     Con la cola fuera, el historial es la otra mitad de la app: además
     de lo cocinado, es por donde se vuelve a un plato que ya salió
     bien. De ahí el buscador y el «repetir». El aviso de dos bases
     seguidas se calcula SIEMPRE sobre la lista completa, no sobre la
     filtrada: filtrar por «pasta» no puede inventarse repeticiones. */
  function pintaHistorial(m) {
    var todos = vals(S.hist).sort(function (a, b) { return String(b.fecha || '').localeCompare(String(a.fecha || '')); });
    var repetida = {};
    todos.forEach(function (h, i) {
      var prev = todos[i + 1];
      if (prev && h.base && prev.base === h.base) repetida[h._id || (h.slug + '-' + h.fecha)] = true;
    });

    var f = S.filtroHist.trim().toLowerCase();
    var lista = !f ? todos : todos.filter(function (h) {
      return [h.titulo, h.slug, h.base, h.nota, (h.tecnica || []).join(' ')]
        .join(' ').toLowerCase().indexOf(f) !== -1;
    });
    $('subtitulo').textContent = todos.length ? todos.length + (todos.length === 1 ? ' vez' : ' veces') : '';

    var html = bandaAviso();
    if (todos.length) {
      html += '<div class="sc-buscador"><input type="search" id="qh" placeholder="Buscar por plato, base o nota" value="' + esc(S.filtroHist) + '" autocomplete="off"></div>';
    }
    if (!todos.length) {
      html += '<div class="sc-vacio"><b>Nada cocinado todavía</b>Al terminar un plato en el cronómetro, se anota aquí.</div>';
    } else if (!lista.length) {
      html += '<div class="sc-vacio"><b>Nada con eso</b>Prueba con el nombre del plato o su base.</div>';
    } else {
      html += '<div class="sc-hist">' + lista.map(function (h) {
        var mismaBase = repetida[h._id || (h.slug + '-' + h.fecha)];
        var chips = [];
        if (h.base) chips.push('<span class="sc-chip' + (mismaBase ? ' sc-urge' : '') + '">' + esc(h.base) + (mismaBase ? ' · dos seguidas' : '') + '</span>');
        (h.tecnica || []).slice(0, 3).forEach(function (t) { chips.push('<span class="sc-chip sc-min">' + esc(t) + '</span>'); });
        if (h.minutosReales) chips.push('<span class="sc-chip sc-tiempo">' + h.minutosReales + ' min reales</span>');
        var hayReceta = !!S.recetas[h.slug];
        var hid = esc(h._id || (h.slug + '-' + h.fecha));
        return '<div class="sc-hito">' +
          '<div class="sc-fecha">' + esc(fechaCorta(h.fecha)) + '</div>' +
          '<div><h3>' + esc(h.titulo || h.slug) + '</h3>' +
          '<div class="sc-chips">' + chips.join('') + '</div>' +
          (h.nota ? '<p class="sc-nota">«' + esc(h.nota) + '»</p>' : '') +
          '</div>' +
          '<div class="sc-hito-acciones">' +
          (hayReceta ? '<button type="button" class="sc-btn sc-min sc-repetir" data-repite="' + esc(h.slug) + '">Repetir →</button>' : '') +
          '<button type="button" class="sc-btn sc-min sc-borrar" data-borra="' + hid + '">Borrar</button>' +
          '</div>' +
          '</div>';
      }).join('') + '</div>';
    }
    m.innerHTML = html;

    var q = $('qh');
    if (q) {
      q.addEventListener('input', function () {
        S.filtroHist = q.value;
        var pos = q.selectionStart;
        pintaHistorial(m);
        var q2 = $('qh');
        if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }
    m.querySelectorAll('[data-repite]').forEach(function (b) {
      b.addEventListener('click', function () { ve('r/' + encodeURIComponent(b.getAttribute('data-repite'))); });
    });
    /* Borrar, en dos toques: el primero arma el botón, el segundo borra
       de verdad. Sin diálogo del navegador, con el mismo patrón que
       «reiniciar» en el cronómetro. */
    var armadoTO = null;
    m.querySelectorAll('.sc-borrar').forEach(function (b) {
      b.addEventListener('click', function () {
        if (b.getAttribute('data-armado') === '1') {
          borraHistorial(b.getAttribute('data-borra'));
          pintaHistorial(m);
          return;
        }
        m.querySelectorAll('.sc-borrar[data-armado="1"]').forEach(function (o) {
          o.removeAttribute('data-armado'); o.textContent = 'Borrar';
        });
        clearTimeout(armadoTO);
        b.setAttribute('data-armado', '1');
        b.textContent = '¿Seguro?';
        armadoTO = setTimeout(function () { b.removeAttribute('data-armado'); b.textContent = 'Borrar'; }, 4000);
      });
    });
  }

  /* --- pantalla 4: la ficha --- */
  function pintaReceta(m) {
    var r = S.recetas[S.slug];
    if (!r) {
      $('cabecera').hidden = false;
      $('titulo').textContent = 'Sous Chef';
      $('subtitulo').textContent = '';
      m.innerHTML = bandaAviso() + '<div class="sc-vacio"><b>No encuentro esa receta</b>Puede que aún no esté guardada.</div>' +
        '<div class="sc-acciones"><button type="button" class="sc-btn sc-sec" id="volver">← Recetas</button></div>';
      $('volver').addEventListener('click', function () { ve('recetas'); });
      return;
    }
    /* La hoja trae su propio título: la cabecera de la app se retira y
       la barra de acciones se queda pegada arriba haciendo de cabecera. */
    $('cabecera').hidden = true;
    var hora = HORA_DEFECTO;
    var tecs = tecnicasDe(r);

    m.innerHTML = bandaAviso() +
      '<div class="sc-acciones sc-pegada">' +
        '<button type="button" class="sc-btn sc-sec" id="volver">← Recetas</button>' +
        '<span class="sc-hora-lanza"><label for="hora-servir">Servir a</label>' +
        '<input type="time" id="hora-servir" value="' + esc(hora) + '"></span>' +
        '<button type="button" class="sc-btn" id="ir-crono">Cronómetro →</button>' +
        '<button type="button" class="sc-btn sc-sec" id="imprimir">Imprimir</button>' +
      '</div>' +
      (tecs.length ? '<div class="sc-tec-links">' + tecs.map(function (t) {
        return '<button type="button" class="sc-chip sc-tec-link" data-tec="' + esc(t.slug) + '">Técnica: ' + esc(t.titulo) + '</button>';
      }).join('') + '</div>' : '') +
      '<div class="v-ficha-wrap"><div class="v-ficha" id="host-ficha"></div></div>';

    $('volver').addEventListener('click', function () { ve('recetas'); });
    $('imprimir').addEventListener('click', function () { window.print(); });
    $('ir-crono').addEventListener('click', function () {
      /* Solo para este salto: no es un default que se recuerde, es la
         hora que acabas de elegir aquí mismo. */
      horaTransito = $('hora-servir').value;
      ve('c/' + encodeURIComponent(r.slug));
    });
    m.querySelectorAll('.sc-tec-link').forEach(function (b) {
      b.addEventListener('click', function () { ve('t/' + encodeURIComponent(b.getAttribute('data-tec'))); });
    });

    /* El mando de raciones es de la ficha; aquí solo se escucha para
       recordar la última cantidad, leyendo el número que ella misma acaba
       de pintar. Va en el contenedor y no en los botones porque el
       listener sobrevive a los repintados de dentro de la ficha. */
    var host = $('host-ficha');
    host.addEventListener('click', function (e) {
      if (reponiendoRac) return;
      var b = e.target && e.target.closest ? e.target.closest('[data-vf="mas"],[data-vf="menos"]') : null;
      if (!b) return;
      var n = host.querySelector('[data-vf="n-rac"]');
      var v = n ? Number(n.textContent) : 0;
      if (isFinite(v) && v > 0) recuerdaRaciones(r.slug, v);
    });

    try { window.VistaFicha.render(host, r); reponRaciones(r, host); }
    catch (e) { host.innerHTML = '<div class="sc-vacio"><b>La ficha no se ha podido pintar</b>' + esc(e.message) + '</div>'; }
  }

  /* Las raciones que elegiste la última vez, repuestas al abrir la ficha.
     VistaFicha.render(host, receta) arranca siempre en receta.raciones y
     no admite otra cosa; lo que sí expone es su mando de raciones en el
     DOM, así que se repone pulsándolo, que es exactamente lo que harías
     tú. El escalado lo sigue haciendo la ficha: aquí no se copia su
     aritmética ni se toca su módulo. Pasar una receta con `raciones`
     cambiada no valdría: ese número es también la BASE del escalado, y
     las cantidades saldrían sin escalar. */
  var reponiendoRac = false;
  function reponRaciones(r, host) {
    var pref = S.prefs[r.slug];
    var quiero = pref ? Number(pref.raciones) : 0;
    var base = Number(r.raciones) || 2;
    if (!isFinite(quiero) || quiero <= 0 || quiero === base) return;
    var pasos = Math.abs(quiero - base);
    /* La ficha topa en 1..20, así que más de 19 pulsaciones no pueden
       mover nada: con un dato corrupto sería darle al botón para nada. */
    if (pasos > 19) return;
    var boton = host.querySelector(quiero > base ? '[data-vf="mas"]' : '[data-vf="menos"]');
    if (!boton) return;
    reponiendoRac = true;
    for (var i = 0; i < pasos; i++) boton.click();
    reponiendoRac = false;
  }

  /* Un toque en «+» rara vez va solo: se espera a que pares de pulsar
     antes de escribir, para no mandar cinco versiones de la misma
     decisión. */
  var racTO = null;
  function recuerdaRaciones(slug, n) {
    clearTimeout(racTO);
    racTO = setTimeout(function () { guardaPref(slug, { raciones: n }); }, 600);
  }

  /* --- pantalla: la ficha de una técnica ---
     Más simple que la de receta: sin hora de servir, sin cronómetro.
     Solo volver e imprimir. */
  function pintaTecnica(m) {
    var t = S.tecnicas[S.slug];
    if (!t) {
      $('cabecera').hidden = false;
      $('titulo').textContent = 'Sous Chef';
      $('subtitulo').textContent = '';
      m.innerHTML = bandaAviso() + '<div class="sc-vacio"><b>No encuentro esa técnica</b>Puede que aún no esté guardada.</div>' +
        '<div class="sc-acciones"><button type="button" class="sc-btn sc-sec" id="volver">← Técnicas</button></div>';
      $('volver').addEventListener('click', function () { ve('tecnicas'); });
      return;
    }
    $('cabecera').hidden = true;
    var recs = recetasConTecnica(t.slug);

    m.innerHTML = bandaAviso() +
      '<div class="sc-acciones sc-pegada">' +
        '<button type="button" class="sc-btn sc-sec" id="volver">← Técnicas</button>' +
        '<button type="button" class="sc-btn sc-sec" id="imprimir">Imprimir</button>' +
      '</div>' +
      (recs.length ? '<div class="sc-tec-links">' + recs.map(function (r) {
        return '<button type="button" class="sc-chip sc-tec-link" data-rec="' + esc(r.slug) + '">Receta: ' + esc(r.titulo) + '</button>';
      }).join('') + '</div>' : '') +
      '<div class="v-ficha-wrap"><div class="v-ficha" id="host-tecnica"></div></div>';

    $('volver').addEventListener('click', function () { ve('tecnicas'); });
    $('imprimir').addEventListener('click', function () { window.print(); });
    m.querySelectorAll('.sc-tec-link[data-rec]').forEach(function (b) {
      b.addEventListener('click', function () { ve('r/' + encodeURIComponent(b.getAttribute('data-rec'))); });
    });

    try { window.VistaTecnica.render($('host-tecnica'), t); }
    catch (e) { $('host-tecnica').innerHTML = '<div class="sc-vacio"><b>La ficha no se ha podido pintar</b>' + esc(e.message) + '</div>'; }
  }

  /* --- pantalla 5: el cronómetro, en capa completa --- */
  var cronoActivo = null;
  function capaCronoAbierta() { return !!cronoActivo; }

  function pintaCrono() {
    var r = S.recetas[S.slug];
    /* Esperar también a `tecnicas`, no solo a la receta: la cocina se abre
       una vez y ya no se vuelve a montar sola, así que si el enlace «ver
       más» de una técnica llegase tarde (una recarga a mitad de un paso,
       por ejemplo) se quedaría sin él el resto de esa sesión. */
    if (!r || !S.listas.tecnicas) {
      /* Abrir el cronómetro directo por URL con la caché vacía (teléfono
         nuevo, o la pestaña recargada antes de que responda la base de
         datos) no puede acabar en el índice: se espera, y la
         suscripción vuelve a llamar aquí cuando lleguen las recetas. */
      if (S.estadoDb === 'conectando') {
        $('cabecera').hidden = false;
        $('titulo').textContent = 'Sous Chef';
        $('subtitulo').textContent = '';
        $('vista').innerHTML = '<div class="sc-aviso"><span>Abriendo el cronómetro…</span></div>';
        return;
      }
      if (!r) { ve('recetas'); return; }
      return; // hay receta pero aún no han llegado las técnicas: se espera
    }
    if (cronoActivo === S.slug) return;
    cierraCrono();

    var capa = $('capa-crono');
    capa.hidden = false;
    capa.innerHTML = '<div class="v-crono" id="host-crono"></div>';
    document.body.classList.add('crono-abierto');
    cronoActivo = S.slug;

    var slug = r.slug;
    var horaInicial = (/^\d{1,2}:\d{2}$/.test(horaTransito || '')) ? horaTransito : HORA_DEFECTO;
    horaTransito = null;   // se consume una sola vez, no se queda pegada
    var guardando = null;
    var api = {
      servir: horaInicial,
      estado: {},
      guardar: function (parcial) {
        clearTimeout(guardando);
        guardando = setTimeout(function () {
          var doc = {
            slug: slug,
            marcados: parcial.marcados || [],
            carriles: parcial.carriles || {},
            servir: parcial.servir || null,
            /* Lo que hace que el cronómetro sobreviva a una recarga: la
               cocina abierta, en qué recipiente estabas y desde cuándo
               cocinas. Los instantes de fin de cada carril van dentro de
               `carriles`, en tiempo absoluto. */
            abierto: !!parcial.abierto,
            foco: parcial.foco || null,
            arrancado: parcial.arrancado || null,
            ts: new Date().toISOString()
          };
          guardaEstadoLocal(slug, doc);
          escribe('estado/' + slug, doc, false);
        }, 400);
      },
      /* Reinicio rápido: se llama al pedirlo desde el aviso de
         "reanudado". Borra el progreso guardado —local y en la base de
         datos— para que no haya nada que reanudar la próxima vez. */
      reinicia: function () {
        clearTimeout(guardando);
        try { localStorage.removeItem('sous-chef-estado-' + slug); } catch (e) {}
        escribe('estado/' + slug, null, true);
      },
      cocinado: function (nota, minutosReales, pasosReales) { anotaCocinado(r, nota, minutosReales, pasosReales); },
      volver: function () { ve('r/' + encodeURIComponent(slug)); },
      /* Las técnicas de la receta, para el «ver más» junto al porqué del
         paso. Cierra la cocina para abrir la ficha de la técnica: el
         progreso no se pierde, `estado/<slug>` ya lo guarda solo. */
      tecnicas: tecnicasDe(r),
      abrirTecnica: function (tSlug) { ve('t/' + encodeURIComponent(tSlug)); }
    };

    /* El estado local va primero (instantáneo y funciona sin red);
       si la base de datos trae uno más nuevo, se usa ese. */
    var local = leeLocal('sous-chef-estado-' + slug, null);
    if (local) api.estado = local;

    /* Bandera para que arranca() no se ejecute dos veces: antes, si la
       base de datos tardaba más de 1200 ms, el setTimeout ya había
       pintado el cronómetro y la promesa lo volvía a pintar por debajo
       con un api.estado que no llevaba nada de lo que el usuario hubiera
       tocado entre medias (clearTimeout(t) solo sirve si gana la
       promesa). */
    var arrancado = false;
    function arranca() {
      if (arrancado) return;
      arrancado = true;
      try { window.VistaCrono.render($('host-crono'), r, api); }
      catch (e) {
        capa.innerHTML = '<div style="padding:24px;color:#EDEDE2;font-family:system-ui">' +
          '<p>El cronómetro no se ha podido abrir: ' + esc(e.message) + '</p>' +
          '<button class="sc-btn" onclick="location.hash=\'#/r/' + esc(slug) + '\'">Volver a la ficha</button></div>';
      }
    }

    if (S.db) {
      var t = setTimeout(arranca, 1200);   // no esperamos a la red más de lo justo
      S.db.doc('estado/' + slug).get().then(function (snap) {
        if (!cronoActivo) return;
        clearTimeout(t);
        if (arrancado) {
          /* Llegó tarde: el timeout ya disparó y el cronómetro está en
             pantalla con el estado local, puede que ya tocado por el
             usuario. Repintar por debajo con lo que trae la base de
             datos sería peor que quedarse con lo local, así que esto se
             descarta aquí — el próximo guardar() de esta sesión lo
             sobrescribirá de todas formas en cuanto el usuario haga
             cualquier cosa. */
          return;
        }
        var d = snap.exists ? snap.data() : null;
        if (d && (!local || String(d.ts || '') > String(local.ts || ''))) api.estado = d;
        arranca();
      }).catch(function () { clearTimeout(t); arranca(); });
    } else {
      arranca();
    }
  }

  function cierraCrono() {
    if (!cronoActivo) return;
    try { window.VistaCrono.destroy(); } catch (e) {}
    var capa = $('capa-crono');
    capa.innerHTML = '';
    capa.hidden = true;
    document.body.classList.remove('crono-abierto');
    cronoActivo = null;
  }

  /* Deshacer «ya está, a la mesa»: unos segundos de margen antes de dar
     por perdido el estado de la cocina. El plato ya queda anotado en el
     historial al momento (no depende de que nadie vuelva a mirar), pero
     el estado de la cocina —todo hecho, listo para el remate— no se
     borra hasta que pasa la ventana, por si hay que volver. */
  var DESHACER_MS = 8000;
  var deshacerTO = null;
  var deshacerInfo = null;   // { id, slug } de lo último anotado, mientras se puede deshacer

  /* HHMMSS del momento en que se anota: solo hace falta para que el id
     del historial no choque cuando se cocina el mismo plato dos veces el
     mismo día. */
  function horaCompacta() {
    var d = new Date();
    function dos(n) { return String(n).padStart(2, '0'); }
    return dos(d.getHours()) + dos(d.getMinutes()) + dos(d.getSeconds());
  }

  function anotaCocinado(r, nota, minutosReales, pasosReales) {
    var fecha = hoy();
    /* Antes el id era slug+fecha a secas: cocinar el mismo plato dos
       veces el mismo día (tacos a mediodía y por la noche) escribía
       encima del primero, porque escribe()->set() reemplaza el
       documento entero. Con la hora detrás caben las dos. Esto cambia
       cómo se generan los ids NUEVOS; los que ya existen en el
       historial (solo slug+fecha, sin hora) se siguen leyendo igual, no
       se tocan. */
    var id = r.slug + '-' + fecha + '-' + horaCompacta();
    /* Los minutos reales los mide el cronómetro desde que abres la
       cocina. Más de 12 h es que la pestaña se quedó abierta de un día
       para otro: no es un dato de cocina y no se anota. */
    var min = Number(minutosReales);
    if (!isFinite(min) || min <= 0 || min > 720) min = null;
    else min = Math.round(min);

    /* Cuánto ha tardado de verdad cada paso, no solo el total: se anota
       para poder afinar recetas que siempre se pasan de tiempo, pero no
       se hace nada más con el dato por ahora. */
    var pasosMap = {};
    (r.pasos || []).forEach(function (p) { pasosMap[p.id] = p.t; });
    var pReal = [];
    if (pasosReales && typeof pasosReales === 'object') {
      Object.keys(pasosReales).forEach(function (pid) {
        var seg = Number(pasosReales[pid]);
        if (isFinite(seg) && seg > 0) pReal.push({ id: pid, t: pasosMap[pid] || pid, segundos: Math.round(seg) });
      });
    }

    var doc = {
      slug: r.slug,
      titulo: r.titulo,
      fecha: fecha,
      base: (r.tags && r.tags.base) || null,
      tecnica: (r.tags && r.tags.tecnica) || [],
      nota: nota || null,
      minutosReales: min,
      pasosReales: pReal.length ? pReal : null,
      /* El resto del archivo (pintaHistorial, borrar, el aviso de «dos
         seguidas») busca primero `_id` y solo si falta reconstruye
         slug+fecha a la vieja usanza. Con el id nuevo llevando hora esa
         reconstrucción ya no valdría, así que se pone `_id` desde ya
         mismo en vez de esperar a que vuelva de la base de datos (que es
         quien lo pondría, vía d.id, en cuanto llegue el snapshot). */
      _id: id
    };
    S.hist[id] = doc;
    guardaCache();
    escribe('historial/' + id, doc, false);

    /* El estado (todo hecho) se queda tal cual durante la ventana de
       deshacer: si te arrepientes, «Deshacer» vuelve a dejar la cocina
       donde estaba, lista para repetir el remate. Pasada la ventana, se
       limpia como siempre. */
    clearTimeout(deshacerTO);
    deshacerInfo = { id: id, slug: r.slug };
    deshacerTO = setTimeout(function () {
      escribe('estado/' + r.slug, null, true);
      try { localStorage.removeItem('sous-chef-estado-' + r.slug); } catch (e) {}
      deshacerInfo = null;
    }, DESHACER_MS);

    S.aviso = {
      txt: 'Anotado: ' + r.titulo + (nota ? ' · «' + nota + '»' : ''),
      ts: Date.now(), ms: DESHACER_MS, deshacer: id
    };
    cierraCrono();
    ve('historial');
  }

  /* El «Deshacer» del aviso: borra la anotación recién hecha y devuelve
     la cocina a como estaba (el estado no se había llegado a limpiar). */
  function deshaceAnotado() {
    if (!deshacerInfo) return;
    clearTimeout(deshacerTO);
    var id = deshacerInfo.id;
    deshacerInfo = null;
    delete S.hist[id];
    guardaCache();
    escribe('historial/' + id, null, true);
    S.aviso = null;
    pinta();
  }

  /* Borrar cualquier entrada del historial, sin ventana de tiempo: dos
     toques (armar, confirmar) para no borrar de un roce, el mismo patrón
     que «reiniciar» en el cronómetro. */
  function borraHistorial(id) {
    delete S.hist[id];
    guardaCache();
    escribe('historial/' + id, null, true);
  }

  /* ---------------- arranque ---------------- */
  function inicia() {
    $('barra').querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { ve(b.getAttribute('data-ir')); });
    });
    window.addEventListener('hashchange', alCambiarRuta);
    /* Delegado en el contenedor, que no se sustituye entero en cada
       pintado (solo su innerHTML): así el botón «Deshacer» del aviso
       funciona sin volver a engancharlo pantalla por pantalla. */
    $('vista').addEventListener('click', function (e) {
      var t = e.target && e.target.closest ? e.target.closest('[data-deshacer]') : null;
      if (t) deshaceAnotado();
    });

    rescataPendientesViejas();
    cargaCache();
    var r = leeRuta();
    S.vista = r.vista; S.slug = r.slug || null;
    pinta();
    conecta();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inicia);
  else inicia();
})();
</script>

</body></html>
