<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sous Chef</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">

<style>
/* ============================================================
   SHELL — la app que envuelve las dos vistas.
   Neutros con sesgo oliva (la cocina), acentos tomados de los
   colores que ya usan los carriles de las recetas.
   ============================================================ */
:root {
  --papel: #EFEDE3;
  --carta: #FBFAF6;
  --carta-2: #E7E5D9;
  --tinta: #191A14;
  --tinta-2: #4A4C40;
  --tinta-3: #6C6E60;
  --linea: #D6D5C6;
  --linea-fuerte: #BDBCAA;
  --ambar: #B07408;
  --ambar-fondo: #F6E7C6;
  --azul: #2C6E92;
  --azul-fondo: #D6E7F0;
  --oliva: #4F6B26;
  --oliva-fondo: #E0E8CD;
  --teja: #A8421C;
  --teja-fondo: #F5DED4;
  --sombra: 0 1px 2px rgba(25,26,20,.07), 0 6px 18px -10px rgba(25,26,20,.18);
  --r: 10px;
  --barra-alto: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #12130F;
    --carta: #1B1C17;
    --carta-2: #24261F;
    --tinta: #EDEDE2;
    --tinta-2: #BFC0B2;
    --tinta-3: #939586;
    --linea: #2E3028;
    --linea-fuerte: #43463A;
    --ambar: #E5AB46;
    --ambar-fondo: #33280F;
    --azul: #79BEDE;
    --azul-fondo: #14262F;
    --oliva: #A3C46A;
    --oliva-fondo: #1D2611;
    --teja: #E8865F;
    --teja-fondo: #331709;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --papel: #12130F;
  --carta: #1B1C17;
  --carta-2: #24261F;
  --tinta: #EDEDE2;
  --tinta-2: #BFC0B2;
  --tinta-3: #939586;
  --linea: #2E3028;
  --linea-fuerte: #43463A;
  --ambar: #E5AB46;
  --ambar-fondo: #33280F;
  --azul: #79BEDE;
  --azul-fondo: #14262F;
  --oliva: #A3C46A;
  --oliva-fondo: #1D2611;
  --teja: #E8865F;
  --teja-fondo: #331709;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px -12px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font-family: 'Newsreader', Georgia, serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3, .sc-ui { font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- armazón ---------- */
#app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(var(--barra-alto) + env(safe-area-inset-bottom));
}
.sc-cabecera {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: baseline; gap: 10px;
  padding: 14px 16px 10px;
  padding-top: calc(14px + env(safe-area-inset-top));
  /* Opaca a propósito: con fondo semitransparente, un móvil sin
     backdrop-filter deja ver el contenido a través del título. */
  background: var(--papel);
  border-bottom: 1px solid var(--linea);
}
.sc-cabecera[hidden] { display: none; }
.sc-cabecera h1 {
  font-size: 19px; font-weight: 800; letter-spacing: -.01em;
  margin: 0; flex: 1 1 auto;
}
.sc-cabecera .sc-sub {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tinta-3); flex: 0 0 auto;
}
main { flex: 1 1 auto; padding: 14px 16px 24px; max-width: 820px; width: 100%; margin: 0 auto; }

.sc-barra {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--carta);
  border-top: 1px solid var(--linea);
  padding-bottom: env(safe-area-inset-bottom);
}
.sc-barra button {
  appearance: none; background: none; border: 0;
  padding: 8px 4px 9px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--tinta-3);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  border-top: 2px solid transparent; margin-top: -1px;
}
.sc-barra button .sc-n {
  font-size: 17px; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.sc-barra button[aria-current="page"] { color: var(--tinta); border-top-color: var(--ambar); }

@media (min-width: 760px) {
  #app { padding-bottom: 0; }
  .sc-barra {
    /* En el DOM va al final (cabecera → contenido → navegación, que es
       el orden en que se lee); en escritorio se coloca arriba. */
    order: -1;
    position: sticky; top: 0; bottom: auto;
    grid-template-columns: repeat(3, minmax(0, 160px));
    justify-content: center; border-top: 0; border-bottom: 1px solid var(--linea);
  }
  .sc-barra button { flex-direction: row; align-items: baseline; gap: 7px; padding: 11px 4px; border-top: 0; border-bottom: 2px solid transparent; }
  .sc-barra button[aria-current="page"] { border-bottom-color: var(--ambar); }
  .sc-cabecera { position: static; }
}

/* ---------- piezas comunes ---------- */
.sc-aviso {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 9px 12px; margin: 0 0 14px;
  background: var(--ambar-fondo); border: 1px solid color-mix(in srgb, var(--ambar) 35%, transparent);
  border-radius: var(--r);
  font-size: 13.5px; line-height: 1.4;
}
.sc-aviso.sc-malo { background: var(--teja-fondo); border-color: color-mix(in srgb, var(--teja) 35%, transparent); }
.sc-vacio {
  padding: 28px 18px; text-align: center; color: var(--tinta-3);
  border: 1px dashed var(--linea-fuerte); border-radius: var(--r);
}
.sc-vacio b { display: block; color: var(--tinta); font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 15px; margin-bottom: 5px; }
.sc-eyebrow {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--tinta-3); margin: 22px 0 8px;
  display: flex; align-items: center; gap: 8px;
}
.sc-eyebrow::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--linea); }
.sc-eyebrow:first-child { margin-top: 0; }

.sc-buscador { display: flex; gap: 8px; margin-bottom: 12px; }
.sc-buscador input {
  flex: 1 1 auto; min-width: 0;
  padding: 9px 11px; font-size: 16px;
  background: var(--carta); color: var(--tinta);
  border: 1px solid var(--linea-fuerte); border-radius: var(--r);
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
}
.sc-buscador input::placeholder { color: var(--tinta-3); }

/* chips de categoría: solo aparecen si hay más de una base distinta */
.sc-catbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
.sc-cat {
  appearance: none; cursor: pointer; touch-action: manipulation;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: .02em;
  padding: 6px 11px; border-radius: 999px;
  background: var(--carta); color: var(--tinta-2);
  border: 1px solid var(--linea-fuerte);
  display: inline-flex; align-items: center; gap: 5px;
}
.sc-cat[aria-current="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.sc-cat-n { font-variant-numeric: tabular-nums; opacity: .75; font-size: 11px; }

.sc-btn {
  appearance: none; cursor: pointer; touch-action: manipulation;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: .01em;
  padding: 9px 13px; border-radius: 8px;
  background: var(--tinta); color: var(--papel); border: 1px solid var(--tinta);
}
.sc-btn.sc-sec { background: var(--carta); color: var(--tinta); border-color: var(--linea-fuerte); }
.sc-btn.sc-min { background: none; border: 0; color: var(--tinta-3); padding: 6px 8px; font-size: 12px; }
.sc-btn.sc-min:hover { color: var(--tinta); }
.sc-btn[disabled] { opacity: .45; cursor: default; }

/* ---------- lista de recetas ---------- */
.sc-recetas { display: grid; gap: 10px; }
@media (min-width: 620px) { .sc-recetas { grid-template-columns: 1fr 1fr; } }
.sc-receta {
  display: block; width: 100%; text-align: left;
  background: var(--carta); border: 1px solid var(--linea);
  border-radius: var(--r); padding: 12px 13px 11px;
  cursor: pointer; box-shadow: var(--sombra);
  font-family: inherit;
}
.sc-receta:hover { border-color: var(--linea-fuerte); }
.sc-receta h3 {
  margin: 0 0 3px; font-size: 16.5px; font-weight: 700; letter-spacing: -.01em;
  text-wrap: balance;
}
.sc-receta .sc-desc {
  margin: 0 0 9px; font-size: 13.5px; line-height: 1.42; color: var(--tinta-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.sc-chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.sc-chip {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
  padding: 2.5px 7px; border-radius: 999px;
  background: var(--carta-2); color: var(--tinta-2);
  white-space: nowrap;
}
.sc-chip.sc-min { background: none; padding-left: 0; padding-right: 4px; }
.sc-chip.sc-tiempo { font-variant-numeric: tabular-nums; background: var(--carta-2); color: var(--tinta); font-weight: 600; }
.sc-chip.sc-compra { background: var(--teja-fondo); color: var(--teja); }
.sc-chip.sc-despensa { background: var(--oliva-fondo); color: var(--oliva); }

/* estrella de favorita: hermana de la tarjeta (un botón dentro de otro
   botón no es HTML válido), colocada encima de su esquina. Se queda
   dentro del padding de la tarjeta, así que no ensancha la lista. */
.sc-tarjeta { position: relative; display: flex; }
.sc-tarjeta > .sc-receta { flex: 1 1 auto; }
.sc-tarjeta > .sc-receta h3 { padding-right: 24px; }
.sc-fav {
  position: absolute; top: 4px; right: 4px; z-index: 1;
  appearance: none; background: none; border: 0; cursor: pointer;
  padding: 4px 7px; line-height: 1; font-size: 16px;
  color: var(--linea-fuerte);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.sc-fav:hover { color: var(--tinta-3); }
.sc-fav[aria-pressed="true"] { color: var(--ambar); }

/* enlaces a la ficha de una técnica, desde la ficha de una receta */
.sc-tec-links { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.sc-chip.sc-tec-link {
  appearance: none; cursor: pointer; touch-action: manipulation;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 600;
  padding: 6px 11px; border-radius: 999px;
  background: var(--carta); color: var(--tinta); border: 1px solid var(--linea-fuerte);
}

/* huella de fuegos: mini-gantt de los carriles */
.sc-huella { display: grid; gap: 2px; margin: 9px 0 8px; }
.sc-huella .sc-h-fila { position: relative; height: 5px; background: var(--carta-2); border-radius: 3px; }
.sc-huella .sc-h-barra { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.sc-huella-pie {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-3);
  display: flex; gap: 9px; flex-wrap: wrap;
}
.sc-huella-pie span { display: inline-flex; align-items: center; gap: 4px; }
.sc-huella-pie i { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; }

/* ---------- historial ---------- */
.sc-chip.sc-urge { background: var(--teja-fondo); color: var(--teja); font-weight: 600; }
.sc-hist { display: grid; gap: 0; }
.sc-hito {
  display: grid; grid-template-columns: 62px 1fr auto; gap: 12px;
  padding: 11px 0; border-bottom: 1px solid var(--linea);
  align-items: start;
}
/* «Repetir» y «Borrar» van pegados a la derecha del hito, uno debajo del
   otro, y no roban ancho al título: en móvil el nombre del plato manda
   y la columna de acciones se queda en su sitio. */
.sc-hito .sc-hito-acciones {
  align-self: center; white-space: nowrap;
  display: flex; flex-direction: column; align-items: stretch; gap: 4px;
}
.sc-hito .sc-fecha {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  font-size: 11.5px; letter-spacing: .04em; color: var(--tinta-3);
  font-variant-numeric: tabular-nums; padding-top: 2px; text-transform: uppercase;
}
.sc-hito h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
.sc-hito .sc-nota { margin: 4px 0 0; font-size: 13.5px; color: var(--tinta-2); font-style: italic; }
.sc-repetido { color: var(--teja); }
/* «Borrar» pide un segundo toque antes de hacer nada: mientras está
   armado se pone del color de aviso, para que quede claro que el
   siguiente toque sí borra. */
.sc-borrar[data-armado="1"] { color: var(--teja); }

/* Aviso con «Deshacer»: el mismo aviso de siempre, con el botón pegado
   a la derecha en vez de debajo del texto. */
.sc-aviso-deshacer { align-items: center; justify-content: space-between; }
.sc-aviso-deshacer span { flex: 1 1 auto; }
.sc-aviso-deshacer .sc-btn { flex: 0 0 auto; }

/* ---------- detalle: barra de acciones ----------
   En la vista de una receta, esta barra ES la cabecera: la de la app
   se oculta para no repetir el título, que ya lo lleva la hoja. */
.sc-acciones {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin: 0 0 14px;
}
.sc-acciones .sc-btn { flex: 0 0 auto; }
.sc-acciones.sc-pegada {
  position: sticky; top: 0; z-index: 20;
  margin: -14px -16px 14px; padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--papel);
  border-bottom: 1px solid var(--linea);
}
/* En el móvil esta barra tiene que caber en UNA fila: dos filas de
   mandos son 110 px de los 844 que hay, y es contenido que el usuario
   deja de ver. Imprimir no aparece (no se imprime desde el teléfono) y
   el reloj se explica solo sin su etiqueta. */
@media (max-width: 759px) {
  .sc-acciones.sc-pegada { flex-wrap: nowrap; gap: 6px; }
  .sc-acciones.sc-pegada #imprimir { display: none; }
  .sc-acciones.sc-pegada .sc-hora-lanza label { display: none; }
  .sc-acciones.sc-pegada .sc-btn { padding: 9px 11px; }
  .sc-acciones.sc-pegada #ir-crono { margin-left: auto; }
}
/* Por debajo de 380 px (y con reloj de 12 h, que ensancha el campo de
   hora) la fila ya no cabe entera: lo primero que sobra es la palabra
   «Recetas», porque la flecha sola ya dice a dónde vuelve. */
@media (max-width: 380px) {
  .sc-acciones.sc-pegada #volver { font-size: 0; }
  .sc-acciones.sc-pegada #volver::before { content: "←"; font-size: 13px; }
  .sc-acciones.sc-pegada .sc-hora-lanza input[type="time"] { padding: 7px 6px; font-size: 14.5px; }
}
.sc-hora-lanza {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 12px;
  color: var(--tinta-3);
}
.sc-hora-lanza input[type="time"] {
  padding: 7px 8px; border-radius: 8px; font-size: 15px;
  background: var(--carta); border: 1px solid var(--linea-fuerte); color: var(--tinta);
  font-variant-numeric: tabular-nums;
  /* Un input de hora hereda el tema del sistema, no el del CSS: sin
     esto, sobre fondo oscuro las cifras y el icono salen en negro. */
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .sc-hora-lanza input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .75; }
}
:root[data-theme="dark"] .sc-hora-lanza input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .75; }

/* ---------- capa del cronómetro ---------- */
#capa-crono {
  position: fixed; inset: 0; z-index: 100;
  height: 100dvh; width: 100%;
  background: #0D0C0A;
  padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  overscroll-behavior: none;
}
#capa-crono > .v-crono { height: 100%; }
body.crono-abierto { overflow: hidden; }

/* ---------- las dos vistas, empotradas ----------
   `isolation: isolate` es la barrera: crea un contexto de apilamiento
   propio, así ningún z-index de dentro de una vista puede subir por
   encima de la cabecera o de la barra de navegación de la app. */
.v-ficha, .v-crono { isolation: isolate; }

/* La ficha se presenta como lo que es: una hoja de papel sobre la mesa
   de trabajo de la app. Marco propio, y el gutter de 16px intacto. */
.v-ficha-wrap {
  border: 1px solid var(--linea-fuerte);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--sombra);
}
@media print {
  .sc-cabecera, .sc-barra, .sc-acciones, .sc-tec-links, #capa-crono { display: none !important; }
  #app { padding: 0; }
  main { padding: 0; max-width: none; }
  .v-ficha-wrap { border: 0; border-radius: 0; box-shadow: none; }
}
</style>

<style>
/* ==========================================================================
   vista-ficha.css — módulo de vista de la ficha imprimible A4.
   TODO va acotado bajo .v-ficha. Las variables llevan prefijo --vf- y se
   declaran en .v-ficha, nunca en :root. Ninguna regla sale del host.
   No carga fuentes: la app ya sirve Bricolage Grotesque y Newsreader.
   La ficha habla en minutos relativos, nunca en horas de reloj.
   ========================================================================== */

.v-ficha{
  /* papel y tinta */
  --vf-papel:#F3EFE4;
  --vf-papel-2:#EAE3D2;
  --vf-tinta:#17150F;
  --vf-tinta-2:#4E483C;
  --vf-tinta-3:#857C6A;
  /* --vf-tinta-3 es de adorno (cifras de apoyo, leyenda, marcas de eje) y
     a propósito no llega a 4,5:1: ahí no hace falta. Pero la línea de
     «SARTÉN · MIN · FUEGO · TAPA» de cada paso es información de
     seguridad, no adorno, así que tiene su propia tinta más oscura
     (4,94:1 sobre --vf-papel, 5,68:1 sobre blanco de impresión). */
  --vf-meta:#6E6656;
  --vf-linea:#D5CDB9;
  /* tipografías de la app */
  --vf-titular:'Bricolage Grotesque', system-ui, sans-serif;
  --vf-texto:'Newsreader', Georgia, serif;
  /* rejilla del gráfico: la pinta el JS por fila */
  --vf-paso:10%;

  background:var(--vf-papel);
  color:var(--vf-tinta);
  font-family:var(--vf-texto);
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

.v-ficha *{box-sizing:border-box}

.v-ficha .hoja{max-width:840px;margin:0 auto;padding:40px 26px 70px}

.v-ficha h1,
.v-ficha h2,
.v-ficha h3,
.v-ficha .dato,
.v-ficha .eti,
.v-ficha button,
.v-ficha .lbl{font-family:var(--vf-titular)}

.v-ficha h1{font-size:clamp(30px,7vw,56px);line-height:1;font-weight:700;letter-spacing:-.025em;margin:0}
.v-ficha h2{font-size:13px;font-weight:700;letter-spacing:.12em;margin:0 0 16px;padding-bottom:7px;
  border-bottom:1.5px solid var(--vf-tinta);color:var(--vf-tinta)}
.v-ficha h3{font-size:14.5px;font-weight:500;margin:0 0 3px}
.v-ficha p{margin:0 0 12px;max-width:70ch}
.v-ficha section{margin-top:38px}

  white-space:nowrap;min-width:66px;text-align:right;flex:0 0 auto}

.v-ficha .ticks{position:relative;height:14px}

  margin-bottom:13px;border-bottom:1px dotted var(--vf-linea);font-size:15px;line-height:1.55}
.v-ficha .pasos li:last-child{border-bottom:0;margin-bottom:0}

  font-family:var(--vf-titular);font-weight:700;font-size:16px;color:var(--vf-tinta-3)}
.v-ficha .pasos h3{font-size:15.5px;font-weight:500;margin:0 0 1px}
.v-ficha .pasos .meta{display:block;font-family:var(--vf-titular);font-size:10.5px;
  letter-spacing:.07em;color:var(--vf-meta);margin-bottom:5px}
.v-ficha .pasos p{font-size:14.5px;color:var(--vf-tinta-2);margin:0;max-width:70ch;line-height:1.5}
/* los hitos de dentro del paso: sangrados y con el minuto en tabular,

.v-ficha .pasos .hitos li{

}
.v-ficha .pasos .hitos li::before{content:none}
.v-ficha .pasos .hitos b{
  font-family:var(--vf-titular);font-size:12px;font-weight:700;color:var(--vf-tinta);
  font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:38px;
}

/* ---------- técnica ---------- */
.v-ficha .corte{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start;
  margin-bottom:18px;break-inside:avoid}
.v-ficha .corte svg{max-width:100%;height:auto}
.v-ficha .corte p{font-size:14px;margin:0;line-height:1.45}
.v-ficha .porque{margin-top:26px}
.v-ficha .porque div{break-inside:avoid;margin-top:13px}
.v-ficha .porque dt{font-family:var(--vf-titular);font-weight:500;font-size:14px}
.v-ficha .porque dd{margin:2px 0 0;font-size:14.5px;color:var(--vf-tinta-2);max-width:70ch;line-height:1.5}

/* ---------- la compra (nuevo en el esquema) ---------- */
.v-ficha .compra li{display:flex;gap:9px;padding:3.5px 0;font-size:15px;line-height:1.35;
  border-bottom:1px dotted var(--vf-linea);max-width:420px}
.v-ficha .compra li:last-child{border-bottom:0}
.v-ficha .compra li .c{font-family:var(--vf-titular);font-weight:700;font-size:14.5px;

.v-ficha .despensa{font-size:14.5px;color:var(--vf-tinta-2);margin:0}

   quita al imprimir): en papel no hay portapapeles.
   El selector .b-copia va detrás de la regla genérica de .v-ficha button,

.v-ficha .copia{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px}
.v-ficha .copia .b-copia{
  width:auto;height:auto;border-radius:999px;padding:7px 15px;

   a mano cuando ni el API ni execCommand han podido. */
.v-ficha .copia .copia-manual{
  flex:1 0 100%;width:100%;min-height:104px;resize:vertical;
  font-family:var(--vf-texto);font-size:13.5px;line-height:1.45;
  color:var(--vf-tinta);background:var(--vf-papel-2);
  border:1px solid var(--vf-linea);border-radius:6px;padding:9px 11px;

   y ser seleccionable, pero no verse ni mover la página. */
.v-ficha .copia-oculta{position:fixed;top:0;left:0;width:1px;height:1px;
  padding:0;border:0;opacity:0;pointer-events:none}

  font-size:12px;color:var(--vf-tinta-3)}

/* ---------- móvil: una sola columna ---------- */
@media (max-width:700px){
  .v-ficha .hoja{padding:24px 16px 50px}
  .v-ficha .grupos{grid-template-columns:1fr;gap:20px}
  .v-ficha .mep{grid-template-columns:1fr}
  .v-ficha .corte{grid-template-columns:1fr}
  .v-ficha .corte svg{max-width:160px}
  .v-ficha .fila{grid-template-columns:96px 1fr 52px;gap:8px}
  .v-ficha .fila .et b{font-size:12.5px}
  .v-ficha .dur{font-size:9.5px}
  /* Cuatro cifras de portada: 2x2 en vez de tres arriba y una huérfana. */
  .v-ficha .datos{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  .v-ficha .dato b{font-size:23px}
}

/* ---------- pantalla estrecha: el gráfico a dos líneas ----------
   Con la etiqueta y la barra en la misma fila, en un móvil la pista se
   queda en 140 px y un paso de 11 minutos mide 24 px: el gráfico deja
   de leerse, y es el corazón de la hoja. Debajo de 520 px cada paso
   pasa a dos líneas y la pista se lleva el ancho completo. */
@media (max-width:520px){
  .v-ficha .fila{
    grid-template-columns:1fr auto;
    grid-template-areas:"et dur" "pista pista";
    gap:2px 8px;padding:7px 0;
    border-bottom:1px solid var(--vf-linea-suave,rgba(0,0,0,.06));
  }
  .v-ficha .fila .et{grid-area:et}
  .v-ficha .fila .dur{grid-area:dur;align-self:end}
  .v-ficha .fila .pista{grid-area:pista;height:14px;margin-top:2px}
  .v-ficha .fila .et b{font-size:13.5px}
  .v-ficha .dur{font-size:10px}
  .v-ficha .dur b{display:inline;font-size:12px}
  .v-ficha .dur .rango{display:inline;margin-left:5px}
  /* La regla del eje se alinea con la pista, que ahora ocupa todo. */
  .v-ficha .fila.regla{grid-template-areas:"pista pista";border-bottom:0;padding-bottom:0}
  .v-ficha .fila.regla .ticks{grid-area:pista}
  .v-ficha .fila.regla > span{display:none}
}

/* ---------- impresión A4 ---------- */
@page{size:A4;margin:13mm}

@media print{
  .v-ficha{background:#fff;font-size:10pt;line-height:1.4}
  .v-ficha .hoja{max-width:none;padding:0}
  .v-ficha .solo-pantalla{display:none !important}
  .v-ficha h1{font-size:30pt}
  .v-ficha h2{font-size:9.5pt}
  /* Sin break-inside:avoid aquí: una section entera (p.ej. «el tiempo» o
     «los pasos») puede medir varias páginas, y forzarla a no partirse la
     manda entera a la página siguiente en cuanto no cabe completa,
     dejando la anterior a medio llenar. Lo que no debe partirse ya está
     protegido pieza a pieza más abajo (fila, paso, bloque de mep...). */
  .v-ficha section{margin-top:16pt}
  .v-ficha .corte,
  .v-ficha .porque div,
  .v-ficha .fila,
  .v-ficha .pasos li,
  .v-ficha .mep>div{break-inside:avoid}
  .v-ficha .dato b{font-size:15pt}
  /* El gráfico de tiempos se pinta con background (la rejilla de .pista y
     las .barra), no con bordes ni SVG: si el diálogo de impresión trae
     "imprimir fondos" desactivado —el valor por defecto en casi todos—
     Chromium se lo salta y el gráfico entero desaparece del papel, solo
     quedan los números de al lado. Y es el corazón de la hoja: dice qué
     pasa en cada fuego a la vez. */
  .v-ficha .pista,
  .v-ficha .barra,
  .v-ficha .leyenda i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

  display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
  background:transparent;border:none;border-radius:0;padding:3px 0;min-height:0;
  font-size:13px;line-height:1.35;color:var(--vc-apagado);font-weight:400;
}
.v-crono .vc-previo li button::before{
  content:"";flex:0 0 auto;width:13px;height:13px;margin-top:2px;
  border:1px solid var(--vc-linea);border-radius:3px;
}
.v-crono .vc-previo li button>span{flex:1 1 auto;min-width:0}
.v-crono .vc-previo li button b{color:var(--vc-texto);font-weight:700}
.v-crono .vc-previo li button.vc-ok{color:var(--vc-tenue);text-decoration:line-through}
.v-crono .vc-previo li button.vc-ok b{color:var(--vc-tenue);font-weight:500}
.v-crono .vc-previo li button.vc-ok::before{background:var(--vc-ok);border-color:var(--vc-ok)}
.v-crono .vc-ancho{width:100%;min-height:52px;font-size:16px;padding:14px 10px;border-radius:14px}

/* ---------- cabecera: desvío + lista de ahora toca + pestañas ---------- */
.v-crono .vc-cab{flex:0 0 auto;padding:8px 14px 0;background:var(--vc-fondo)}
.v-crono .vc-sup{display:flex;align-items:flex-end;gap:11px;padding-bottom:9px}
.v-crono .vc-sup input[type=time]{padding-left:7px;padding-right:7px}
/* En la cabecera de la cocina el icono del selector son 20 px que no
   caben: en el móvil el propio campo abre el selector al tocarlo. En la
   portada, donde sobra sitio, se queda. */
.v-crono .vc-sup input[type=time]::-webkit-calendar-picker-indicator{display:none}
/* En pantallas estrechas esta fila lleva cuatro cosas: se aprietan los
   huecos antes que dejar que se corte una hora. */
@media (max-width:430px){
  .v-crono .vc-sup{gap:8px}
  .v-crono .vc-sup input[type=time]{min-width:78px}
}
/* Y en las estrechas se va la hora actual antes que cortar nada: es el
   único dato de la fila que el teléfono ya enseña solo, arriba. 400 px
   y no 380: a 390-393 px (el ancho de prueba y el de un móvil normal de
   gama media) esta regla no saltaba nunca y SERVIR/AHORA/LLEGADA se
   quedaban chafados igual. */
@media (max-width:400px){
  .v-crono .vc-sup .vc-ahora{display:none}
}

/* ---------- lo que venció mientras no mirabas ----------
   El móvil puede congelar la app, pero no el reloj: al volver, esto
   dice qué saltó y hace cuánto. También es donde vive el reinicio
   rápido, así que la fila de acciones es su propia columna: con el
   texto y los dos botones en una sola fila, en pantallas estrechas
   "REINICIAR" empujaba la hora y se cortaba. */
.v-crono .vc-devuelta{
  display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;
  background:var(--vc-carta);border:1px solid var(--vc-alerta);border-radius:11px;
  padding:8px 8px 8px 11px;
}
.v-crono .vc-devuelta>div:first-child{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.v-crono .vc-devuelta b{font-size:10px;letter-spacing:.09em;color:var(--vc-alerta);font-weight:700}
.v-crono .vc-devuelta span{font-size:13px;line-height:1.3;color:var(--vc-texto)}
.v-crono .vc-devuelta-acc{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:5px}
.v-crono .vc-devuelta button{
  flex:0 0 auto;min-height:26px;padding:0;border-radius:8px;
  background:transparent;border:1px solid var(--vc-linea);color:var(--vc-apagado);font-size:12px;
}
.v-crono .vc-devuelta [data-vc="cerrar-devuelta"]{width:26px;align-self:flex-end}
.v-crono .vc-devuelta-reset{
  width:auto;min-height:24px;padding:4px 9px;font-size:10px;font-weight:700;
  letter-spacing:.06em;white-space:nowrap;
}
.v-crono .vc-devuelta-reset:active{background:var(--vc-carta-2)}
.v-crono .vc-devuelta-reset[data-armado="1"]{
  color:var(--vc-alerta);border-color:var(--vc-alerta);background:#33140F;
}

/* El bloque del desvío no puede comerse el panel del paso: se le pone
   techo y es él el que se desplaza por dentro, no la pantalla. */
.v-crono .vc-plan{
  background:var(--vc-carta);border:1px solid var(--vc-linea);border-radius:13px;overflow:hidden;
  display:flex;flex-direction:column;max-height:46vh;
}
.v-crono .vc-plan.vc-tarde{border-color:var(--vc-alerta)}
.v-crono .vc-plan-cab{
  flex:0 0 auto;
  display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
  background:transparent;border:none;border-radius:0;padding:9px 11px;min-height:0;
  font-size:13.5px;line-height:1.4;color:var(--vc-apagado);
}
/* El texto es de longitud variable («Vas en hora. Llegada 15:47,
   prevista 15:30») y en pantallas estrechas envuelve a dos líneas: sin
   min-width:0 el span no cede sitio y empuja la flecha fuera, que es lo
   que se veía como "chafado". */
.v-crono .vc-plan-cab [data-vc-n="plan-txt"]{flex:1 1 auto;min-width:0}
.v-crono .vc-plan-cab b{color:var(--vc-texto);font-weight:700;font-variant-numeric:tabular-nums}
.v-crono .vc-plan.vc-tarde .vc-plan-cab b{color:var(--vc-alerta)}
.v-crono .vc-plan-cab .vc-flecha{margin-left:auto;flex:0 0 auto;padding-top:1px;color:var(--vc-tenue);font-size:12px}
.v-crono .vc-plan-cuerpo{
  border-top:1px solid var(--vc-linea);
  flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.v-crono .vc-tarea{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
  background:transparent;border:none;border-radius:0;padding:6px 11px;min-height:0;
  border-bottom:1px solid var(--vc-linea);
}
.v-crono .vc-tarea:last-child{border-bottom:none}
.v-crono .vc-tarea .vc-ord{font-size:11px;font-weight:700;color:var(--vc-tenue);min-width:13px;flex:0 0 auto}
.v-crono .vc-tarea.vc-ya .vc-ord{color:var(--vc-ok)}
.v-crono .vc-tarea.vc-atender .vc-ord{color:var(--vc-alerta)}
.v-crono .vc-tarea .vc-cu{flex:1;min-width:0}
.v-crono .vc-tarea .vc-ct{display:block;font-size:14px;font-weight:500;color:var(--vc-texto);line-height:1.25}
.v-crono .vc-tarea .vc-ct span{
  color:var(--tar-txt,var(--vc-apagado));font-weight:700;font-size:10.5px;
  letter-spacing:.08em;margin-right:5px;
}
.v-crono .vc-tarea .vc-ce{display:block;font-size:11.5px;color:var(--vc-tenue);line-height:1.3;margin-top:2px}
.v-crono .vc-tarea.vc-ya .vc-ce{color:var(--vc-ok)}
.v-crono .vc-tarea.vc-atender .vc-ce{color:var(--vc-alerta)}
.v-crono .vc-tarea.vc-bloq .vc-ce{color:var(--vc-saco)}
.v-crono .vc-tarea .vc-creloj{
  font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--vc-tenue);flex:0 0 auto;
}
.v-crono .vc-nota-plan{
  font-size:12.5px;line-height:1.45;color:var(--vc-apagado);
  padding:9px 11px;border-top:1px solid var(--vc-linea);
  flex:0 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.v-crono .vc-nota-plan b{color:var(--vc-texto);font-weight:500}

.v-crono .vc-tabs{
  display:flex;gap:7px;overflow-x:auto;padding:9px 0 4px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.v-crono .vc-tabs::-webkit-scrollbar{display:none}
.v-crono .vc-tab{
  flex:1 1 0;min-width:112px;background:var(--vc-carta);
  border:1px solid var(--vc-linea);border-top:3px solid var(--vc-linea);
  border-radius:4px 4px 13px 13px;padding:6px 9px 8px;text-align:left;
  display:flex;flex-direction:column;gap:2px;min-height:0;
}
.v-crono .vc-tab.vc-activo{background:var(--vc-carta-2);border-top-color:var(--tab-color)}
.v-crono .vc-tab.vc-suena{border-color:var(--vc-alerta);border-top-color:var(--vc-alerta);background:#33140F}
@media (prefers-reduced-motion:no-preference){
  .v-crono .vc-tab.vc-suena{animation:vc-late 1.1s steps(1,end) infinite}
}
@keyframes vc-late{0%,49%{background:#33140F}50%,100%{background:var(--vc-carta)}}
.v-crono .vc-tab .vc-tn{font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--tab-txt)}
.v-crono .vc-tab .vc-tt{
  font-size:23px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  color:var(--vc-texto);line-height:1.1;
}
.v-crono .vc-tab .vc-tt.vc-parado{color:var(--vc-tenue)}
.v-crono .vc-tab .vc-tt.vc-pasado{color:var(--vc-alerta)}
.v-crono .vc-tab .vc-ts1{
  font-size:11.5px;color:var(--vc-apagado);line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.v-crono .vc-tab .vc-ts2{
  font-size:10.5px;color:var(--vc-tenue);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.v-crono .vc-tab .vc-ts2.vc-bloq{color:var(--vc-saco)}
.v-crono .vc-pista{font-size:10.5px;color:var(--vc-tenue);letter-spacing:.03em;padding:2px 2px 5px}

/* ---------- panel: un solo paso ---------- */
.v-crono .vc-panel{
  flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px 14px 6px;display:flex;flex-direction:column;
}
.v-crono .vc-pcab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.v-crono .vc-idx{font-size:11px;letter-spacing:.05em;color:var(--vc-tenue)}
.v-crono .vc-panel h2{
  margin:3px 0 0;font-size:clamp(21px,6vw,28px);font-weight:700;
  letter-spacing:-.025em;line-height:1.08;color:var(--vc-texto);
}
.v-crono .vc-quem{flex:0 0 auto;text-align:right}
.v-crono .vc-quem .vc-n{font-size:38px;font-weight:700;line-height:.88;letter-spacing:-.04em;color:var(--vc-acento)}
.v-crono .vc-quem .vc-n.vc-off{color:var(--vc-tenue)}
.v-crono .vc-b9{display:flex;gap:2px;margin-top:5px;width:84px}
.v-crono .vc-b9 i{flex:1;height:6px;border-radius:2px;background:var(--vc-linea)}
.v-crono .vc-b9 i.vc-on{background:var(--vc-acento)}
.v-crono .vc-tp{display:block;margin-top:6px;font-size:11px;font-weight:700;color:var(--vc-apagado)}
.v-crono .vc-tp.vc-act{color:var(--vc-tapa)}
.v-crono .vc-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:11px}
.v-crono .vc-pill{border:1px solid var(--vc-linea);border-radius:99px;padding:3px 8px;color:var(--vc-apagado)}
.v-crono .vc-pill.vc-flexible{color:var(--vc-ok);border-color:var(--vc-borde-ok)}
.v-crono .vc-pill.vc-critico{color:var(--vc-alerta);border-color:var(--vc-borde-mal)}
.v-crono .vc-req{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.v-crono .vc-req div{
  font-size:12.5px;line-height:1.3;border-left:2px solid var(--vc-linea);
  padding-left:8px;color:var(--vc-apagado);
}
.v-crono .vc-req div b{
  font-weight:700;font-size:10.5px;letter-spacing:.07em;display:block;color:var(--vc-tenue);
}
.v-crono .vc-req div.vc-falta{border-color:var(--vc-alerta);color:var(--vc-texto)}
.v-crono .vc-req div.vc-falta b{color:var(--vc-alerta)}
.v-crono .vc-req div.vc-listo{border-color:var(--vc-borde-ok)}
.v-crono .vc-req div.vc-listo b{color:var(--vc-ok)}
.v-crono .vc-req div.vc-junto{border-color:var(--vc-acento)}
.v-crono .vc-req div.vc-junto b{color:var(--vc-apagado)}
.v-crono .vc-avisos{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.v-crono .vc-avisos>b{font-weight:700;font-size:10px;letter-spacing:.08em;color:var(--vc-tenue)}
.v-crono .vc-aviso{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 8px;width:100%;text-align:left;
  background:var(--vc-carta-2);border:1px solid var(--vc-linea);border-left:3px solid var(--av);
  border-radius:8px;padding:6px 9px;min-height:0;font-size:13px;
}
.v-crono .vc-aviso em{
  font-style:normal;font-weight:700;font-size:11.5px;color:var(--av-txt);
  flex:0 0 auto;min-width:56px;
}
.v-crono .vc-aviso span{flex:1 1 110px;color:var(--vc-texto);line-height:1.25}
.v-crono .vc-aviso i{
  font-style:normal;font-size:11px;color:var(--vc-tenue);flex:1 0 100%;padding-left:64px;
}
.v-crono .vc-aviso.vc-urge{border-color:var(--av);background:var(--vc-carta)}
.v-crono .vc-reloj{
  font-size:clamp(40px,13vw,64px);font-weight:700;letter-spacing:-.045em;line-height:.92;
  font-variant-numeric:tabular-nums;margin:7px 0 0;color:var(--vc-texto);
}
.v-crono .vc-reloj.vc-parado{color:var(--vc-tenue)}
.v-crono .vc-reloj.vc-pasado{color:var(--vc-alerta)}
.v-crono .vc-prog{height:3px;background:var(--vc-linea);border-radius:99px;margin-top:7px;position:relative}
.v-crono .vc-prog i{display:block;height:100%;width:0;background:var(--vc-acento);border-radius:99px}
/* marcas de los hitos sobre la barra: dicen de un vistazo que este paso
   no es "enciende y espera", que tiene cosas dentro */
.v-crono .vc-prog u{
  position:absolute;top:-3px;width:2px;height:9px;margin-left:-1px;
  background:var(--vc-apagado);border-radius:1px;text-decoration:none;
}
.v-crono .vc-prog u.vc-pasada{background:var(--vc-acento)}

/* ---------- hitos: los avisos de dentro del paso ---------- */
.v-crono .vc-hitos{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.v-crono .vc-hito{
  display:inline-flex;align-items:baseline;gap:6px;max-width:100%;
  border:1px solid var(--vc-linea);border-radius:99px;padding:3px 10px 3px 7px;
  font-size:12.5px;line-height:1.25;color:var(--vc-apagado);
}
.v-crono .vc-hito em{
  font-style:normal;font-weight:700;font-size:11px;color:var(--vc-tenue);
  font-variant-numeric:tabular-nums;flex:0 0 auto;
}
.v-crono .vc-hito.vc-vivo{
  border-color:var(--vc-acento);background:var(--vc-carta-2);color:var(--vc-texto);font-weight:500;
}
.v-crono .vc-hito.vc-vivo em{color:var(--vc-acento)}
.v-crono .vc-hito.vc-pasado{color:var(--vc-tenue);border-style:dashed}

/* ---------- el porqué del paso, plegado ---------- */
.v-crono .vc-porque{margin-top:8px}
.v-crono .vc-porque-btn{
  min-height:0;padding:3px 9px;font-size:11.5px;letter-spacing:.04em;
  background:transparent;border:1px solid var(--vc-linea);color:var(--vc-tenue);border-radius:99px;
}
.v-crono .vc-porque p{
  font-family:"Newsreader",Georgia,serif;font-size:15px;line-height:1.45;
  color:var(--vc-apagado);margin:8px 0 0;border-left:2px solid var(--vc-linea);padding-left:10px;
}
.v-crono .vc-tecnicas{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.v-crono .vc-tec-link{
  min-height:0;padding:5px 10px;font-size:12px;letter-spacing:.01em;font-weight:600;
  background:transparent;border:1px solid var(--vc-acento);color:var(--vc-acento);border-radius:99px;
}
.v-crono .vc-detalle{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.v-crono .vc-fila{display:flex;gap:9px;align-items:flex-start;font-size:15.5px;line-height:1.32;color:var(--vc-texto)}
.v-crono .vc-fila em{
  font-style:normal;font-weight:700;font-size:11px;letter-spacing:.05em;
  padding-top:3px;min-width:42px;flex:0 0 auto;
}
.v-crono .vc-f-meto em{color:var(--vc-meto)}
.v-crono .vc-f-saco em{color:var(--vc-saco)}
.v-crono .vc-f-tapa em{color:var(--vc-tapa)}
.v-crono .vc-nota{
  font-family:"Newsreader",Georgia,serif;font-size:16px;line-height:1.42;
  color:var(--vc-apagado);margin:8px 0 0;
}
.v-crono .vc-sig{margin-top:auto;padding-top:10px;font-size:12.5px;color:var(--vc-tenue);line-height:1.35}
.v-crono .vc-sig b{color:var(--vc-apagado);font-weight:500}

/* ---------- mandos: los tres en una fila baja ---------- */
.v-crono .vc-mandos{
  flex:0 0 auto;display:grid;grid-template-columns:1.5fr 1.15fr .75fr;gap:6px;
  padding:6px 14px 10px;background:var(--vc-fondo);border-top:1px solid var(--vc-linea);
}
/* Los tres mandos en UNA fila de ~44px de alto: son los que se tocan
   docenas de veces por receta con las manos mojadas, así que llevan el
   mínimo de 44 px de toque fiable (el de portada, .vc-ancho, ya lo
   pasaba de sobra con 52; estos se quedaban en 38). Subir el alto no
   toca el ancho: las columnas siguen medidas para que los rótulos más
   largos ("Empezar igual", "Hecho · siguiente") quepan en una línea; el
   de bloqueado cabe en dos sin estirar la fila. */
.v-crono .vc-mandos>button{overflow:hidden;line-height:1.15;font-size:13px;min-height:44px}
/* carril cerrado: no hay temporizador que mandar, solo la salida al
   siguiente carril, y ocupa la fila entera */
.v-crono .vc-mandos.vc-solo{grid-template-columns:1fr}
.v-crono .vc-principal{
  background:var(--vc-texto);color:#0D0C0A;border-color:var(--vc-texto);
  font-weight:700;font-size:14.5px;min-height:44px;line-height:1.15;
}
.v-crono .vc-principal:active{background:#D8D3C6}
.v-crono .vc-principal.vc-urge{background:var(--vc-alerta);border-color:var(--vc-alerta);color:#2A0A05}
.v-crono .vc-principal.vc-bloq{
  background:transparent;color:var(--vc-alerta);border:1.5px solid var(--vc-alerta);
  font-size:11.5px;line-height:1.12;padding:4px 5px;letter-spacing:-.005em;
}

/* ---------- remate: ya está, a la mesa ---------- */
.v-crono .vc-final{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.v-crono .vc-final-scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:8px 18px 14px;display:flex;flex-direction:column;gap:12px;
}
.v-crono .vc-final h2{
  margin:0;font-size:clamp(26px,8vw,40px);font-weight:700;letter-spacing:-.03em;
  line-height:1.04;color:var(--vc-texto);
}
.v-crono .vc-final p{
  font-family:"Newsreader",Georgia,serif;font-size:16.5px;line-height:1.45;
  color:var(--vc-apagado);margin:0;
}
.v-crono .vc-final-pie{
  flex:0 0 auto;padding:12px 18px 10px;display:flex;flex-direction:column;gap:10px;
  border-top:1px solid var(--vc-linea);background:var(--vc-fondo);
}
.v-crono .vc-final-pie label{font-size:10px;letter-spacing:.09em;color:var(--vc-tenue)}
.v-crono .vc-resumen{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.v-crono .vc-resumen li{font-size:12.5px;color:var(--vc-apagado);line-height:1.35}
.v-crono .vc-resumen li b{color:var(--vc-texto);font-weight:700;font-size:10.5px;letter-spacing:.08em;margin-right:6px}

/* ---------- pantallas cortas ---------- */
@media (max-height:680px){
  .v-crono .vc-plan{max-height:37vh}
  .v-crono .vc-plan-cab{padding:7px 11px}
  .v-crono .vc-reloj{font-size:clamp(34px,11vw,48px);margin-top:5px}
  .v-crono .vc-nota{font-size:14.5px;margin-top:8px}
  .v-crono .vc-tab .vc-tt{font-size:20px}
  /* Esto ya no toca a Hecho/Empezar/+30 s: .vc-mandos>button (más
     específica) los mantiene en 44 px también en pantallas cortas. Aquí
     se sigue encogiendo todo lo demás para ganar el alto que haga
     falta. */
  .v-crono button{min-height:34px;padding:5px 6px;font-size:13px}

<div id="app">
  <header class="sc-cabecera" id="cabecera">
    <h1 id="titulo">Sous Chef</h1>
    <span class="sc-sub" id="subtitulo"></span>
  </header>
  <main id="vista" tabindex="-1"></main>
  <nav class="sc-barra" id="barra">
    <button type="button" data-ir="recetas"><span class="sc-n" id="n-recetas">·</span>Recetas</button>
    <button type="button" data-ir="historial"><span class="sc-n" id="n-hist">·</span>Historial</button>
    <button type="button" data-ir="tecnicas"><span class="sc-n" id="n-tecnicas">·</span>Técnicas</button>
  </nav>

<div id="capa-crono" hidden></div>

<script>
/* ==========================================================================
   vista-ficha.js — módulo de vista de la ficha imprimible.
   Contrato: window.VistaFicha = { render(host, receta), destroy() }.
   Pinta SOLO dentro de host (un <div class="v-ficha"> vacío que ya existe).
   No toca body, head, :root ni html. Sin almacenamiento, sin red, sin deps.

   El esquema nuevo tiene UN array receta.pasos y de él se derivan las dos
   vistas de esta ficha: las filas del gráfico (off, min, carril) y la línea
   meta de cada paso de la lista (carril, min, f, tapa). receta.tiempo ya no
   existe: el total es receta.totalMin.

   La ficha habla en minutos relativos al arranque. Nunca en horas de reloj.
   ========================================================================== */
(function () {
  'use strict';

  var COLOR_NEUTRO = '#857C6A';

  /* ---------------- utilidades ---------------- */

  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* Los campos que el esquema declara como HTML (mep.l, cortes.svg) pasan
     tal cual; todo lo demás se escapa. */
  function crudo(v) {
    return v === null || v === undefined ? '' : String(v);
  }

  function lista(v) {
    return Object.prototype.toString.call(v) === '[object Array]' ? v : [];
  }

  function hay(v) {
    return lista(v).length > 0;
  }

  function txt(v) {
    return typeof v === 'string' && v.replace(/\s+/g, '') !== '';
  }

  /* Formato del original: entero desde 10, un decimal por debajo, coma. */
  function num(v) {
    if (v >= 100) return String(Math.round(v));
    if (v >= 10) return String(Math.round(v));
    var r = Math.round(v * 10) / 10;
    return String(r).replace('.', ',');
  }

  /* ---------------- estado del módulo ---------------- */

  var st = null; // { host, receta, rac, onMenos, onMas, onCopiar, elMenos, elMas, elCopiar, avisoTO }

  function carrilDe(receta, id) {
    var cs = lista(receta.carriles);
    for (var i = 0; i < cs.length; i++) {
      if (cs[i] && cs[i].id === id) return cs[i];
    }
    return { id: id, nombre: id ? String(id) : '', color: COLOR_NEUTRO };
  }

  function nombreCarril(c) {
    return String(c && c.nombre ? c.nombre : (c && c.id) || '').toUpperCase();
  }

  function colorCarril(c) {
    return c && txt(c.color) ? c.color : COLOR_NEUTRO;
  }

  function dur(paso) {
    var m = Number(paso.min);
    return isFinite(m) && m > 0 ? m : 0;
  }

  /* Minutos del plan. num() redondea a entero a partir de 10 —correcto para
     gramos— y ahí se perdía el minuto 114,5 del salteado. Aquí el medio
     minuto se conserva siempre, y con coma. */
  function minNum(v) {
    var r = Math.round((+v || 0) * 2) / 2;
    return String(r).replace('.', ',');
  }

  function ini(paso) {
    var o = Number(paso.off);
    return isFinite(o) ? o : 0;
  }

  /* Línea meta de la lista de pasos, en mayúsculas:
     SARTÉN · 12 MIN · FUEGO 8 · SIN TAPA   (SIN FUEGO si f es null;
     el tramo de tapa se omite si tapa es null) */
  function metaPaso(receta, paso) {
    var t = [];
    var n = nombreCarril(carrilDe(receta, paso.carril));
    if (n) t.push(n);
    /* num() y no el número crudo: desde el salteado hay pasos de 2,5 min,
       y en una hoja donde todas las cantidades llevan coma, un «2.5 MIN»
       con punto canta como un dato sin formatear. */
    t.push(minNum(dur(paso)) + ' MIN');
    t.push(paso.f === null || paso.f === undefined ? 'SIN FUEGO' : 'FUEGO ' + paso.f);
    if (txt(paso.tapa)) t.push(String(paso.tapa).toUpperCase());
    return t.join(' · ');
  }

  /* Sublínea de la fila del gráfico: "fuego 5 · TAPA PUESTA".
     El fuego en minúscula; la tapa tal cual viene en el dato. */
  function subFila(paso) {
    var s = paso.f === null || paso.f === undefined ? 'sin fuego' : 'fuego ' + paso.f;
    if (txt(paso.tapa)) s += ' · ' + paso.tapa;
    return s;
  }

  /* ---------------- escalado de raciones (matemática del original) ---------------- */

  function cantidad(it) {
    var base = Number(st.receta.raciones) || 1;
    var f = st.rac / base;
    var marca = it.esc === 'sub' && f !== 1 ? ' *' : '';
    if (txt(it.txt)) return it.txt + marca;
    var a = Number(it.a);
    if (!isFinite(a)) return '';
    var v = a * (it.esc === 'sub' ? Math.pow(f, 0.75) : f);
    return num(v) + (txt(it.u) ? ' ' + it.u : '') + marca;
  }

  /* ---------------- secciones ---------------- */

  function htmlPortada(r) {
    var datos = lista(r.datos)
      .map(function (d) {
        return '<div class="dato"><b>' + esc(d[0]) + '</b><span>' + esc(d[1]) + '</span></div>';
      })
      .join('');
    return '<header class="portada">' +
      '<h1>' + esc(r.titulo) + '</h1>' +
      (txt(r.descripcion) ? '<p class="desc">' + esc(r.descripcion) + '</p>' : '') +
      '<div class="datos">' +
        '<div class="dato"><b data-vf="d-rac">' + st.rac + '</b><span>raciones</span></div>' +
        datos +
      '</div>' +
    '</header>';
  }

  function htmlIngredientes(r) {
    if (!hay(r.grupos)) return '';
    return '<section>' +
      '<h2>INGREDIENTES</h2>' +
      '<div class="raciones solo-pantalla">' +
        '<span class="lbl">RACIONES</span>' +
        '<button type="button" data-vf="menos" aria-label="Menos raciones">−</button>' +
        '<span class="n-rac" data-vf="n-rac">' + st.rac + '</span>' +
        '<button type="button" data-vf="mas" aria-label="Más raciones">+</button>' +
      '</div>' +
      '<div class="grupos" data-vf="grupos">' + htmlGrupos(r) + '</div>' +
      (txt(r.notaEscala) ? '<p class="nota-esc">' + esc(r.notaEscala) + '</p>' : '') +
    '</section>';
  }

  function htmlGrupos(r) {
    return lista(r.grupos)
      .map(function (g) {
        return '<div class="grupo">' +
          (txt(g.n) ? '<h3>' + esc(g.n) + '</h3>' : '') +
          '<ul>' + lista(g.items).map(function (it) {
            return '<li><span class="c">' + esc(cantidad(it)) + '</span><span>' + esc(it.n) + '</span></li>';
          }).join('') + '</ul>' +
        '</div>';
      })
      .join('');
  }

  function htmlTiempo(r) {
    var pasos = lista(r.pasos);
    if (!pasos.length) return '';

    var total = Number(r.totalMin);
    if (!isFinite(total) || total <= 0) {
      total = pasos.reduce(function (m, p) { return Math.max(m, ini(p) + dur(p)); }, 0) || 1;
    }

    /* eje de minutos: mismo cálculo por tramos que la plantilla original */
    var granu = total <= 60 ? 5 : 10;
    var salto = Math.ceil(total / 5 / granu) * granu;
    if (!isFinite(salto) || salto <= 0) salto = total;
    var ticks = [];
    for (var m = 0; m <= total; m += salto) ticks.push(m);
    if (ticks[ticks.length - 1] !== total) {
      /* el último tramo puede quedar muy corto: si la marca anterior cae
         encima del total, se retira antes de añadirlo */
      if (ticks.length > 1 && total - ticks[ticks.length - 1] < salto * 0.5) ticks.pop();
      ticks.push(total);
    }

    var html = '<div class="fila regla"><span></span><div class="ticks">' +
      ticks.map(function (v) {
        return '<span class="tick" style="left:' + (v / total * 100) + '%">' + v + '</span>';
      }).join('') +
      '</div><span></span></div>';

    var rejilla = (100 / (total / 10)) + '%';

    html += pasos.map(function (p) {
      var c = carrilDe(r, p.carril);
      var a = ini(p), d = dur(p);
      var izq = Math.max(0, Math.min(100, a / total * 100));
      var ancho = Math.max(0, Math.min(100 - izq, d / total * 100));
      return '<div class="fila">' +
        '<span class="et"><b>' + esc(p.t) + '</b>' +
          '<span>' + esc(nombreCarril(c) + ' · ' + subFila(p)) + '</span></span>' +
        '<div class="pista" style="--vf-paso:' + rejilla + '">' +
          '<div class="barra" style="left:' + izq + '%;width:' + ancho + '%;background:' + esc(colorCarril(c)) + '"></div>' +
        '</div>' +
        '<span class="dur"><b>' + minNum(d) + '′</b>' +
          '<span class="rango">min ' + minNum(a) + '-' + minNum(a + d) + '</span></span>' +
      '</div>';
    }).join('');

    var leyenda = lista(r.carriles).map(function (c) {
      return '<span><i style="background:' + esc(colorCarril(c)) + '"></i>' + esc(c.nombre || c.id) + '</span>';
    }).join('') + '<span>eje en minutos desde el arranque</span>';

    return '<section>' +
      '<h2>EL TIEMPO</h2>' +
      '<div class="gantt" data-vf="gantt">' + html + '</div>' +
      '<div class="leyenda">' + leyenda + '</div>' +
      (txt(r.lectura) ? '<p class="lectura">' + esc(r.lectura) + '</p>' : '') +
    '</section>';
  }

  function htmlMep(r) {
    if (!hay(r.mep)) return '';
    var bloques = lista(r.mep).map(function (b) {
      var tag = b.orden ? 'ol' : 'ul';
      return '<div>' +
        (txt(b.t) ? '<h3>' + esc(b.t) + '</h3>' : '') +
        (txt(b.porq) ? '<p class="porq">' + esc(b.porq) + '</p>' : '') +
        '<' + tag + '>' + lista(b.l).map(function (x) {
          return '<li>' + crudo(x) + '</li>';
        }).join('') + '</' + tag + '>' +
      '</div>';
    }).join('');
    return '<section><h2>ANTES DE EMPEZAR</h2><div class="mep">' + bloques + '</div></section>';
  }

  /* Hitos: lo que hay que hacer DENTRO del paso, en minutos desde que
     ese paso arranca. En la ficha se leen sentado, así que van como
     lista bajo la prosa; en el cronómetro suenan. */
  function htmlHitos(p) {
    var hs = lista(p.hitos).filter(function (h) {
      return h && isFinite(Number(h.en)) && Number(h.en) > 0;
    });
    if (!hs.length) return '';
    return '<ul class="hitos">' + hs.map(function (h) {
      var en = Math.round(Number(h.en));
      var mm = Math.floor(en / 60), ss = en % 60;
      return '<li><b>+' + mm + ':' + String(ss).padStart(2, '0') + '</b>' + esc(h.t) + '</li>';
    }).join('') + '</ul>';
  }

  function htmlPasos(r) {
    var pasos = lista(r.pasos);
    if (!pasos.length) return '';
    var items = pasos.map(function (p) {
      var prosa = txt(p.p) ? p.p : (txt(p.nota) ? p.nota : '');
      return '<li>' +
        '<h3>' + esc(p.t) + '</h3>' +
        '<span class="meta">' + esc(metaPaso(r, p)) + '</span>' +
        (prosa ? '<p>' + esc(prosa) + '</p>' : '') +
        htmlHitos(p) +
      '</li>';
    }).join('');
    return '<section><h2>LOS PASOS</h2><ol class="pasos" data-vf="pasos">' + items + '</ol></section>';
  }

  function htmlTecnica(r) {
    if (!hay(r.cortes) && !hay(r.porque)) return '';
    var cortes = lista(r.cortes).map(function (c) {
      return '<div class="corte">' + crudo(c.svg) +
        '<div>' + (txt(c.t) ? '<h3>' + esc(c.t) + '</h3>' : '') +
        (txt(c.p) ? '<p>' + esc(c.p) + '</p>' : '') + '</div></div>';
    }).join('');
    var porque = lista(r.porque).map(function (p) {
      return '<div><dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd></div>';
    }).join('');
    return '<section>' +
      '<h2>TÉCNICA Y DECISIONES</h2>' +
      (cortes ? '<div>' + cortes + '</div>' : '') +
      (porque ? '<dl class="porque">' + porque + '</dl>' : '') +
    '</section>';
  }

  /* Lo que aporta el esquema nuevo y la plantilla no tenía: la compra.
     Las cantidades pasan por cantidad(), el mismo escalado que los
     ingredientes: si la ficha está puesta en 4 raciones, comprar para 2
     sería un error silencioso. */
  function htmlListaCompra(r) {
    var items = lista(r.compra);
    if (!items.length) return '<p class="despensa">Sale entera de la despensa.</p>';
    return '<ul class="compra">' + items.map(function (c) {
      return '<li><span class="c">' + esc(cantidad(c)) + '</span><span>' + esc(c.n) + '</span></li>';
    }).join('') + '</ul>';
  }

  function htmlCompra(r) {
    if (r.compra === null || r.compra === undefined) return '';
    /* El botón y el hueco del aviso van fuera del div que se repinta al
       cambiar las raciones, para no perder el listener ni el mensaje. */
    var copiar = hay(r.compra)
      ? '<div class="copia solo-pantalla">' +
          '<button type="button" class="b-copia" data-vf="copiar">Copiar la lista</button>' +
          '<span class="aviso" data-vf="aviso-copia" role="status" aria-live="polite"></span>' +
          '<textarea class="copia-manual" data-vf="copia-manual" readonly hidden ' +
            'aria-label="Lista de la compra para copiar a mano"></textarea>' +
        '</div>'
      : '';
    return '<section><h2>HAY QUE COMPRAR</h2>' +
      '<div data-vf="compra">' + htmlListaCompra(r) + '</div>' +
      copiar +
    '</section>';
  }

  /* ---------------- copiar la compra al portapapeles ---------------- */

  /* Texto plano pensado para pegarlo en las notas del móvil: una cosa por
     línea, «500 g carne picada», sin viñetas ni HTML, y una cabecera que
     diga de qué plato y para cuántas raciones es la lista. */
  function textoCompra(r) {
    var lineas = [];
    var t = txt(r.titulo) ? r.titulo : 'Receta';
    lineas.push('Compra · ' + t + ' · ' + st.rac + (st.rac === 1 ? ' ración' : ' raciones'));
    lineas.push('');
    lista(r.compra).forEach(function (c) {
      /* La marca « *» remite a la nota de escala de la ficha; en el móvil
         esa nota no viaja, así que el asterisco solo despistaría. */
      var q = cantidad(c).replace(/ \*$/, '');
      var n = txt(c.n) ? c.n : '';
      lineas.push(q && n ? q + ' ' + n : q || n);
    });
    return lineas.join('\n');
  }

  function avisa(mensaje, malo) {
    var a = sel('aviso-copia');
    if (!a) return;
    a.textContent = mensaje;
    if (malo) a.setAttribute('data-malo', '1'); else a.removeAttribute('data-malo');
    clearTimeout(st.avisoTO);
    /* Un fallo se lee más despacio que un «copiado», y encima deja texto
       seleccionado abajo: se queda el doble de tiempo. */
    st.avisoTO = setTimeout(function () {
      if (!st) return;
      var e = sel('aviso-copia');
      if (e) { e.textContent = ''; e.removeAttribute('data-malo'); }
    }, malo ? 8000 : 2500);
  }

  /* Plan B cuando no hay navigator.clipboard (contexto no seguro, permiso
     denegado, navegador viejo): el truco clásico del textarea temporal más
     execCommand, que sigue funcionando dentro del gesto del usuario.
     Devuelve true solo si el navegador confirma la copia. */
  function copiaConExec(texto) {
    var ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', 'readonly');
    /* Fuera de la vista pero dentro del documento y sin position:absolute
       con top negativo enorme: en iOS eso impide seleccionar. */
    ta.className = 'copia-oculta';
    st.host.appendChild(ta);
    var bien = false;
    try {
      ta.select();
      if (ta.setSelectionRange) ta.setSelectionRange(0, texto.length);
      bien = document.execCommand('copy') === true;
    } catch (e) {
      bien = false;
    }
    if (ta.parentNode) ta.parentNode.removeChild(ta);
    return bien;
  }

  /* Último recurso: si ni el API ni execCommand, se enseña el texto ya
     seleccionado para copiarlo a mano. Lo que no puede pasar es que el
     usuario se quede sin saber si tiene la lista o no. */
  function copiaAMano(texto) {
    var ta = sel('copia-manual');
    if (!ta) { avisa('No he podido copiar.', true); return; }
    ta.hidden = false;
    ta.value = texto;
    try {
      ta.focus();
      ta.select();
      if (ta.setSelectionRange) ta.setSelectionRange(0, texto.length);
    } catch (e) {}
    avisa('No he podido copiar solo: ahí tienes el texto seleccionado.', true);
  }

  function copiaCompra() {
    var texto = textoCompra(st.receta);
    /* El API responde más tarde: si para entonces la ficha ya es otra
       (otra receta, o cerrada), este resultado no le pertenece. */
    var mio = st;
    var ta = sel('copia-manual');
    if (ta) { ta.hidden = true; ta.value = ''; }

    var api = null;
    try {
      api = navigator.clipboard && typeof navigator.clipboard.writeText === 'function'
        ? navigator.clipboard : null;
    } catch (e) {
      api = null;
    }

    if (!api) {
      if (copiaConExec(texto)) avisa('Copiado'); else copiaAMano(texto);
      return;
    }

    /* El API puede resolver o rechazar más tarde (permiso, foco perdido);
       en el rechazo aún queda el plan B, aunque ya fuera del gesto. */
    var p;
    try {
      p = api.writeText(texto);
    } catch (e) {
      if (copiaConExec(texto)) avisa('Copiado'); else copiaAMano(texto);
      return;
    }
    if (!p || typeof p.then !== 'function') { avisa('Copiado'); return; }
    p.then(function () {
      if (st === mio) avisa('Copiado');
    }, function () {
      if (st !== mio) return;
      if (copiaConExec(texto)) avisa('Copiado'); else copiaAMano(texto);
    });
  }

  /* ---------------- pintado ---------------- */

  function sel(nombre) {
    return st.host.querySelector('[data-vf="' + nombre + '"]');
  }

  function repintaIngredientes() {
    var n = sel('n-rac');
    if (n) n.textContent = st.rac;
    var d = sel('d-rac');
    if (d) d.textContent = st.rac;
    var g = sel('grupos');
    if (g) g.innerHTML = htmlGrupos(st.receta);
    /* La compra escala con las mismas raciones: si no se repintara, la
       lista de la pantalla y la que se copia dirían cosas distintas. */
    var c = sel('compra');
    if (c) c.innerHTML = htmlListaCompra(st.receta);
  }

  window.VistaFicha = {
    render: function (host, receta) {
      if (!host) return;
      if (st) window.VistaFicha.destroy();
      var r = receta || {};
      st = { host: host, receta: r, rac: Number(r.raciones) || 2 };

      host.innerHTML = '<div class="hoja">' +
        htmlPortada(r) +
        htmlIngredientes(r) +
        htmlTiempo(r) +
        htmlMep(r) +
        htmlPasos(r) +
        htmlTecnica(r) +
        htmlCompra(r) +
        (txt(r.pie) ? '<p class="pie">' + esc(r.pie) + '</p>' : '') +
      '</div>';

      st.elMenos = sel('menos');
      st.elMas = sel('mas');
      st.onMenos = function () { if (st.rac > 1) { st.rac--; repintaIngredientes(); } };
      st.onMas = function () { if (st.rac < 20) { st.rac++; repintaIngredientes(); } };
      st.elCopiar = sel('copiar');
      st.onCopiar = function () { copiaCompra(); };
      if (st.elMenos) st.elMenos.addEventListener('click', st.onMenos);
      if (st.elMas) st.elMas.addEventListener('click', st.onMas);
      if (st.elCopiar) st.elCopiar.addEventListener('click', st.onCopiar);
    },

    destroy: function () {
      if (!st) return;
      if (st.elMenos && st.onMenos) st.elMenos.removeEventListener('click', st.onMenos);
      if (st.elMas && st.onMas) st.elMas.removeEventListener('click', st.onMas);
      if (st.elCopiar && st.onCopiar) st.elCopiar.removeEventListener('click', st.onCopiar);
      clearTimeout(st.avisoTO);
      if (st.host) st.host.innerHTML = '';
      st = null;
    }
  };
})();
</script>
<script>
/* ============================================================
   vista-crono.js — módulo de vista del cronómetro multi-fuego.

   window.VistaCrono.render(host, receta, api)
   window.VistaCrono.destroy()

   Nada global más. Sin localStorage, sin fetch, sin dependencias.
   El estado que debe sobrevivir sale por api.guardar(); el estado
   volátil (qué pestaña miras, si el porqué está abierto) vive aquí.

   Datos: receta.carriles son metadatos y receta.pasos es un array
   plano; la cola de cada carril se reconstruye agrupando por
   paso.carril y CONSERVANDO EL ORDEN DEL ARRAY.

   EL TIEMPO VA POR RELOJ DE PARED. Un carril en marcha no guarda
   "segundos que quedan" y les resta uno por tic: guarda `finAt`, el
   instante absoluto en que acaba. Lo que queda se calcula siempre
   contra Date.now(). Así el móvil puede congelar el intervalo —

        })
        .map(function (c) { return { c: c, r: rango(c), h: horaDe(c) }; })
        .sort(function (a, b) { return a.r - b.r || a.h - b.h; })
        .map(function (x) { return x.c; });
    }
    /* el carril accionable que toca mirar, o null si no queda ninguno */
    function siguienteAccionable() { return cola(true)[0] || null; }
    /* la salida de emergencia: el carril pendiente cuyo paso toca antes */
    function siguientePorHora() {
      return carriles.filter(function (c) { return !est[c.id].fin; })
        .sort(function (a, b) { return horaDe(a) - horaDe(b); })[0] || null;
    }

    /* ---------- 7. armazón ---------- */
    /* Las recetas antiguas no traen mise en place. Antes que dejar la
       portada en blanco, se usa la lista de ingredientes agrupada por
       recipiente: sigue siendo lo que hay que sacar antes de encender. */
    function bloquesPortada() {
      if (Array.isArray(receta.mep) && receta.mep.length) {
        return { titulo: 'ANTES DE ENCENDER NADA', bloques: receta.mep };
      }
      var grupos = Array.isArray(receta.grupos) ? receta.grupos : [];
      if (!grupos.length) return { titulo: '', bloques: [] };
      return {
        titulo: 'SACA ESTO ANTES DE EMPEZAR',
        bloques: grupos.map(function (g) {
          return {
            t: g && g.n || 'INGREDIENTES',
            l: (Array.isArray(g && g.items) ? g.items : []).map(function (it) {
              var cant = it.txt || ((it.a != null ? it.a : '') + (it.u ? ' ' + it.u : ''));
              return (cant ? '<b>' + cant + '</b> · ' : '') + (it.n || '');
            })
          };
        })
      };
    }

    function mepBloques() {
      var mep = bloquesPortada().bloques;
      return mep.map(function (b, bi) {
        var lineas = Array.isArray(b && b.l) ? b.l : [];
        /* se quitan los porqués: son de la ficha */
        return '<div class="vc-bloque"><b>' + esc(b && b.t || '') + '</b><ul>' +

            return '<li><button type="button" data-vc="mep" data-id="' + id + '"' +

                 botón flex se convierte en un item aparte y la línea se
                 parte en dos columnas */
              '<span>' + conNegritas(x) + '</span></button></li>';
          }).join('') + '</ul></div>';
      }).join('');
    }

    host.innerHTML =

    var N = {};
    Array.prototype.forEach.call(host.querySelectorAll('[data-vc-n]'), function (el) {
      N[el.getAttribute('data-vc-n')] = el;
    });
    var Z = {};
    Array.prototype.forEach.call(host.querySelectorAll('[data-vc-zona]'), function (el) {
      Z[el.getAttribute('data-vc-zona')] = el;
    });
    host.querySelector('#vc-servir0').value = horaServir;
    host.querySelector('#vc-servir').value = horaServir;

    /* ---------- 8. pintado ---------- */
    function tabsHTML() {
      N.tabs.innerHTML = carriles.map(function (c) {
        return '<button class="vc-tab" type="button" data-vc="foco" data-foco="' + esc(c.id) + '"' +
          ' data-tab="' + esc(c.id) + '" style="--tab-color:' + esc(c.color) + ';--tab-txt:' + esc(c.txt) + '">' +
          '<span class="vc-tn">' + esc(c.nombre) + '</span>' +
          '<span class="vc-tt">00:00</span>' +
          '<span class="vc-ts1"></span>' +
          '<span class="vc-ts2"></span></button>';
      }).join('');
    }
    function tabDe(id) { return N.tabs.querySelector('[data-tab="' + id + '"]'); }

    function ir(id) {
      if (!porId[id]) return;
      if (id !== M.foco && !M.pistaVista) { M.pistaVista = true; N.pista.classList.add('vc-oculto'); }
      if (id !== M.foco) M.porqueAbierto = false;
      M.foco = id;
      var t = tabDe(id);
      if (t && t.scrollIntoView) {
        try { t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); }
        catch (e) { }
      }
      pinta();
    }
    function rota(paso) {
      var k = indice(M.foco) + paso;
      if (k < 0) k = carriles.length - 1;
      if (k >= carriles.length) k = 0;
      ir(carriles[k].id);
    }

    function pintaTabs() {
      carriles.forEach(function (c) {
        var s = est[c.id], p = c.pasos[s.i], e = estado(c), t = tabDe(c.id);
        if (!t) return;
        var q = quedan(c);
        var tt = t.querySelector('.vc-tt');
        tt.textContent = s.fin ? '—' : mmss(q);
        tt.className = 'vc-tt' + (s.fin ? ' vc-parado'
          : (q <= 0 ? ' vc-pasado' : (corre(c) ? '' : ' vc-parado')));
        t.querySelector('.vc-ts1').textContent = s.fin ? 'terminado' : p.t;
        var r2 = t.querySelector('.vc-ts2');
        if (s.fin) { r2.textContent = 'fuera del plan'; r2.className = 'vc-ts2'; }
        else if (e.cl === 'bloq') { r2.textContent = e.txt; r2.className = 'vc-ts2 vc-bloq'; }
        else {
          var res = (c.tipo === 'fuego' ? 'fuego ' + (p.f || 0) : 'sin fuego');
          var tc = tapaCorta(p);
          if (tc) res += ' · ' + tc;
          r2.textContent = res + ' · ' + e.txt;
          r2.className = 'vc-ts2';
        }
        t.className = 'vc-tab' + (M.foco === c.id ? ' vc-activo' : '') +
          (!s.fin && q <= 0 && s.corriendo ? ' vc-suena' : '');
        t.setAttribute('aria-current', M.foco === c.id ? 'true' : 'false');
      });
    }

    function pintaPlan() {
      var ahora = new Date();
      N.ahora.textContent = hhmm(ahora);
      var pend = 0;
      carriles.forEach(function (c) { pend = Math.max(pend, restante(c)); });
      var real = new Date(ahora.getTime() + pend * 1000);
      N.real.textContent = hhmm(real);

      var lista = carriles.filter(function (c) { return !est[c.id].fin; })
        .map(function (c) { return { c: c, e: estado(c) }; })
        .sort(function (a, b) { return a.e.orden - b.e.orden; });

      var retraso = 0;
      lista.forEach(function (x) {
        if (x.e.cl !== 'ya') return;
        var d = sugerido(x.c.pasos[est[x.c.id].i].off);
        var m = Math.round((ahora - d) / 60000);
        if (m > retraso) retraso = m;
      });
      var difFin = Math.round((real - servirDate()) / 60000);
      var tarde = retraso > 2 || difFin > 1;
      var atender = lista.filter(function (x) { return x.e.cl === 'atender'; })[0];

      N.plan.className = 'vc-plan' + (tarde || atender ? ' vc-tarde' : '');
      var cabTxt;
      if (atender) cabTxt = '<b>' + esc(atender.c.nombre) + ' ya está</b> · pulsa Hecho para seguir';
      else if (tarde) cabTxt = '<b>' + Math.max(retraso, difFin) + ' min por detrás.</b> Comerás sobre las <b>' + hhmm(real) + '</b>';
      else cabTxt = '<b>Vas en hora.</b> Llegada <b>' + hhmm(real) + '</b>, prevista <b>' + hhmm(servirDate()) + '</b>';
      N['plan-txt'].innerHTML = cabTxt;
      N['plan-flecha'].textContent = M.planAbierto ? '▴' : '▾';
      N['plan-cuerpo'].classList.toggle('vc-oculto', !M.planAbierto);
      N['nota-plan'].classList.toggle('vc-oculto', !M.planAbierto || !tarde);

      N['plan-cuerpo'].innerHTML = lista.map(function (x, n) {
        var p = x.c.pasos[est[x.c.id].i];
        return '<button class="vc-tarea vc-' + x.e.cl + '" type="button" data-vc="foco" data-foco="' +
          esc(x.c.id) + '" style="--tar-txt:' + esc(x.c.txt) + '">' +
          '<span class="vc-ord">' + (n + 1) + '</span>' +
          '<span class="vc-cu"><span class="vc-ct"><span>' + esc(x.c.nombre) + '</span>' + esc(p.t) + '</span>' +
          '<span class="vc-ce">' + esc(x.e.txt) + '</span></span>' +
          '<span class="vc-creloj">' + esc(x.e.reloj) + '</span></button>';
      }).join('');

      if (tarde) {
        var aguantan = [], criticos = [];
        carriles.forEach(function (c) {
          var s = est[c.id];
          if (s.fin) return;
          for (var j = s.i; j < c.pasos.length; j++) {
            var p = c.pasos[j];
            if (p.holgura === 'flexible' && aguantan.indexOf(p.t) < 0) aguantan.push(p.t);
            if (p.holgura === 'critico' && criticos.indexOf(p.t) < 0) criticos.push(p.t);
          }
        });
        N['nota-plan'].innerHTML =
          '<b>Prevista</b> ' + hhmm(servirDate()) + ' · <b>realista</b> ' + hhmm(real) + '<br>' +
          (aguantan.length ? '<b>Aguantan la espera:</b> ' + esc(aguantan.join(', ')) + '.<br>' : '') +
          (criticos.length ? '<b>No esperan, encadénalos:</b> ' + esc(criticos.join(', ')) + '.' : '');
      }
    }

    /* qué toca en los otros recipientes mientras este corre, desde los off */
    function paralelo() {
      var ahora = new Date(), out = [];
      carriles.forEach(function (c) {
        if (c.id === M.foco) return;
        var s = est[c.id];
        if (s.fin) return;
        if (corre(c) && quedan(c) > 0) return;
        var p = c.pasos[s.i];
        if (faltan(p).length) return;
        var m = Math.round((sugerido(p.off) - ahora) / 60000);
        if (m > 12) return;
        out.push({ c: c, p: p, m: m, atender: (s.corriendo && quedan(c) <= 0), pausado: s.pausado });
      });
      out.sort(function (a, b) { return a.m - b.m; });
      return out;
    }

    function pintaAvisos() {
      var a = paralelo(), n = N.avisos;
      if (!a.length) { n.innerHTML = ''; n.style.display = 'none'; return; }
      n.style.display = '';
      n.innerHTML = '<b>MIENTRAS ESTO CORRE</b>' + a.map(function (x) {
        var cuando = x.atender ? 'ya · Hecho'
          : x.pausado ? 'en pausa'
            : x.m <= 0 ? 'ahora' : 'en ' + x.m + ' min';
        var tc = tapaCorta(x.p);
        var res = x.c.tipo === 'fuego'
          ? ('fuego ' + (x.p.f || 0) + (tc ? ' · ' + tc : ''))
          : 'sin fuego';
        return '<button class="vc-aviso' + (x.m <= 0 ? ' vc-urge' : '') + '" type="button"' +
          ' data-vc="foco" data-foco="' + esc(x.c.id) + '"' +
          ' style="--av:' + esc(x.c.color) + ';--av-txt:' + esc(x.c.txt) + '">' +
          '<em>' + cuando + '</em><span>' + esc(x.c.nombre) + ' · ' + esc(x.p.t) + '</span>' +
          '<i>' + res + ' · ' + minTxt(x.p.s) + ' min · sugerido ' + hhmm(sugerido(x.p.off)) + '</i>' +
          '</button>';
      }).join('');
    }

    function reiniciaAvisos() {
      carriles.forEach(function (c) {
        var s = est[c.id];
        s.avisado = !s.fin && (sugerido(c.pasos[s.i].off) - new Date() <= 0);
      });
    }

    /* Los hitos del paso que estás mirando: las marcas de la barra y la
       tira de abajo. El que acaba de saltar se queda resaltado un rato,
       porque el aviso sonó mientras tenías las manos en la sartén. */
    function pintaHitos(c, p) {
      if (!p.hitos.length) {
        N.hitos.innerHTML = ''; N.hitos.style.display = 'none';
        N.marcas.innerHTML = '';
        return;
      }
      N.hitos.style.display = '';
      var s = est[c.id], t = transcurrido(c);
      N.marcas.innerHTML = p.hitos.map(function (h) {
        return '<u style="left:' + (h.en / p.s * 100).toFixed(2) + '%"' +
          (t >= h.en ? ' class="vc-pasada"' : '') + '></u>';
      }).join('');
      N.hitos.innerHTML = p.hitos.map(function (h, k) {
        var dado = t >= h.en;
        var vivo = dado && (t - h.en) < HITO_VIVO && !s.fin;
        var falta = h.en - t;
        var cuando = dado ? (vivo ? 'ahora' : 'hecho') : mmss(Math.max(0, falta));
        return '<span class="vc-hito' + (vivo ? ' vc-vivo' : (dado ? ' vc-pasado' : '')) + '">' +
          '<em>' + esc(cuando) + '</em>' + esc(h.t) + '</span>';
      }).join('');
    }

    /* ---------- 7 bis. lo que se lee en voz alta ----------
       pintaPanel() se llama cada segundo por el latido del reloj, haya
       cambiado algo o no: si la región viva colgara del reloj o se
       reescribiera sin más en cada pintado, un lector de pantalla la
       leería cada segundo y quedaría inservible. Por eso anuncia() solo
       toca el DOM cuando el TEXTO es distinto del último anunciado, y
       ese texto nunca lleva el mm:ss — solo el estado ya digerido
       («en marcha», «en pausa», «¡listo! pulsa Hecho»...), igual que en
       las pestañas y el plan. La cuenta atrás en sí se queda muda a
       propósito. */
    function anuncia(t) {
      if (!N.anuncio || t === M.ultimoAnuncio) return;
      M.ultimoAnuncio = t;
      N.anuncio.textContent = t;
    }

    function pintaPanel() {
      var c = carril(M.foco), s = est[c.id];
      var h = host.querySelector('[data-vc="hecho"]');
      var pl = host.querySelector('[data-vc="play"]');
      var ms = host.querySelector('[data-vc="mas"]');
      host.style.setProperty('--vc-acento', c.color);
      if (s.fin) {
        N.idx.textContent = c.nombre;
        N.titulo.textContent = 'Terminado';
        anuncia(c.nombre + ': terminado.');
        N.quem.style.visibility = 'hidden';
        N.pills.innerHTML = ''; N.req.innerHTML = '';
        N.reloj.textContent = '00:00'; N.reloj.className = 'vc-reloj vc-parado';
        N.prog.style.width = '100%'; N.marcas.innerHTML = '';
        N.hitos.innerHTML = ''; N.hitos.style.display = 'none';
        N.detalle.innerHTML = ''; N.nota.textContent = '';
        N.porque.innerHTML = '';
        /* Aquí no hay paso que cronometrar, pero tampoco puede quedarse el
           pie sin mandos: se deja la salida al carril que toca antes. */
        var sig = siguienteAccionable() || siguientePorHora();
        if (sig) {
          N.sig.innerHTML = 'Este recipiente ya está fuera del plan. Sigue por <b>' +
            esc(sig.nombre) + '</b>.';
          Z.mandos.classList.remove('vc-oculto');
          Z.mandos.classList.add('vc-solo');
          pl.classList.add('vc-oculto');
          ms.classList.add('vc-oculto');
          h.className = 'vc-principal';
          h.textContent = 'Siguiente: ' + sig.nombre + ' · ' +
            hhmm(sugerido(sig.pasos[est[sig.id].i].off));
          h.dataset.ir = sig.id;
        } else {
          N.sig.textContent = 'Este recipiente ya está fuera del plan.';
          Z.mandos.classList.add('vc-oculto');
        }
        return;
      }
      Z.mandos.classList.remove('vc-oculto');
      Z.mandos.classList.remove('vc-solo');
      pl.classList.remove('vc-oculto');
      ms.classList.remove('vc-oculto');
      var p = c.pasos[s.i], f = faltan(p), q = quedan(c);
      var bloqueado = f.length > 0 && !s.corriendo && !s.salto;
      N.idx.textContent = c.nombre + ' · paso ' + (s.i + 1) + ' de ' + c.pasos.length +
        ' · sugerido ' + hhmm(sugerido(p.off));
      N.titulo.textContent = p.t;
      anuncia(c.nombre + ' — ' + p.t + ': ' + estado(c).txt);

      if (c.tipo === 'fuego') {
        N.quem.style.visibility = 'visible';
        var fu = p.f || 0;
        N['n-fuego'].textContent = fu;
        N['n-fuego'].className = 'vc-n' + (fu ? '' : ' vc-off');
        var b = '';
        for (var k = 1; k <= 9; k++) b += '<i class="' + (k <= fu ? 'vc-on' : '') + '"></i>';
        N['b-fuego'].innerHTML = b;
        N['tp-fuego'].textContent = p.tapa || '';
        N['tp-fuego'].className = 'vc-tp' + (/PUESTA|MEDIAS/i.test(p.tapa || '') ? ' vc-act' : '');
      } else {
        N.quem.style.visibility = 'hidden';
      }

      N.pills.innerHTML =
        '<span class="vc-pill vc-' + p.holgura + '">' +
        (p.holgura === 'flexible' ? 'aguanta espera' : p.holgura === 'critico' ? 'no espera' : 'ajustado') +
        '</span>' +
        '<span class="vc-pill">' + minTxt(p.s) + ' min</span>' +
        (!s.corriendo ? '<span class="vc-pill">sin arrancar</span>'
          : (s.pausado ? '<span class="vc-pill">en pausa</span>' : ''));

      var rq = '';
      if (p.dep.length) {
        rq += f.length
          ? '<div class="vc-falta"><b>ANTES HAY QUE TERMINAR</b>' + esc(p.dep.map(etiqueta).join(' · ')) + '</div>'
          : '<div class="vc-listo"><b>REQUISITO CUMPLIDO</b>' + esc(p.dep.map(etiqueta).join(' · ')) + '</div>';
      }
      if (p.junto) rq += '<div class="vc-junto"><b>A LA VEZ QUE</b>' + esc(etiqueta(p.junto)) + '</div>';
      N.req.innerHTML = rq;

      N.reloj.textContent = mmss(q);
      N.reloj.className = 'vc-reloj' + (q <= 0 ? ' vc-pasado' : (corre(c) ? '' : ' vc-parado'));
      N.prog.style.width = (p.s > 0 ? Math.min(100, Math.max(0, (p.s - q) / p.s * 100)) : 100) + '%';
      pintaHitos(c, p);

      var d = '';
      if (p.meto) d += '<div class="vc-fila vc-f-meto"><em>METO</em><span>' + esc(p.meto) + '</span></div>';
      if (p.saco) d += '<div class="vc-fila vc-f-saco"><em>SACO</em><span>' + esc(p.saco) + '</span></div>';
      if (p.tapa) d += '<div class="vc-fila vc-f-tapa"><em>TAPA</em><span>' + esc(p.tapa) + '</span></div>';
      N.detalle.innerHTML = d;
      N.nota.textContent = p.nota || '';
